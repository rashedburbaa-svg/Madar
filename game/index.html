<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1618">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مستعمرة المدار">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-192.png">
<link rel="manifest" href="manifest.json">
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
<title>مستعمرة المدار</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css?v=00c6fdeb">
</head>
<body style="padding-top:env(safe-area-inset-top,0px)">


<div class="wrap" dir="rtl" lang="ar">
  <section id="hub" class="inner">
    <div class="hubhead">
      <h1>مستعمرة <span>المدار</span></h1>
      <div class="pill" title="مجموع نجومك"><svg viewBox="0 0 100 100"><path d="M50 6c5 28 16 39 44 44-28 5-39 16-44 44-5-28-16-39-44-44 28-5 39-16 44-44z"/></svg><span id="totalStars">0</span></div>
      <button class="tog" id="sndBtn" type="button" aria-label="الأصوات">🔊</button>
      <button class="tog" id="vibBtn" type="button" aria-label="الاهتزاز">📳</button>
      <button class="tog" id="saveBtn" type="button" aria-label="حفظ التقدّم ونقله">💾</button>
    </div>
    <div class="rank" id="rank"></div>
    <div class="panel" id="pDaily" role="tabpanel" aria-labelledby="tDaily">
      <div class="daily" id="daily"></div>
      <div class="missions" id="missions"></div>
    </div>
    <div class="panel" id="pColony" role="tabpanel" aria-labelledby="tColony">
      <div id="colony"></div>
    </div>
    <div class="panel" id="pBadges" role="tabpanel" aria-labelledby="tBadges">
      <div class="achhead"><b>أوسمتك</b><span id="achCount"></span></div>
      <div class="achbar"><i id="achBar"></i></div>
      <div class="badges" id="badges"></div>
    </div>
  </section>

  <section id="play" class="inner" hidden>
    <div class="topbar">
      <button class="icon" id="back" type="button" aria-label="رجوع إلى المستعمرة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
      <h2 id="gTitle">لعبة</h2>
      <span class="tag" id="dailyTag" hidden>تحدي اليوم</span>
      <button class="icon" id="pauseBtn" type="button" aria-label="إيقاف مؤقت"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg></button>
      <button class="icon" id="helpBtn" type="button" aria-label="طريقة اللعب">?</button>
      <button class="icon" id="lvlBtn" type="button" aria-label="اختيار المستوى"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg></button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="stage" id="stage"></div>
    <div class="controls" id="ctrl"></div>
    <p class="help" id="help"></p>
  </section>
</div>
<nav class="tabbar" id="tabbar" dir="rtl" lang="ar" role="tablist" aria-label="أقسام المستعمرة">
  <div class="tb">
    <button type="button" role="tab" id="tColony" data-tab="pColony" aria-controls="pColony">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M5 20v-5a7 7 0 0 1 14 0v5"/><path d="M12 8V4M10 4h4"/><path d="M9.5 20v-3h5v3"/></svg>
      <span>المستعمرة</span>
    </button>
    <button type="button" role="tab" id="tDaily" data-tab="pDaily" aria-controls="pDaily">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M12 13.5l.9 1.8 2 .3-1.45 1.4.35 2-1.8-.95-1.8.95.35-2-1.45-1.4 2-.3z" fill="currentColor" stroke="none"/></svg>
      <span>التحديات اليومية</span><i class="dot" id="dailyDot" hidden></i>
    </button>
    <button type="button" role="tab" id="tBadges" data-tab="pBadges" aria-controls="pBadges">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="6"/><path d="M8.5 13.9L7 22l5-3 5 3-1.5-8.1"/></svg>
      <span>الأوسمة</span>
    </button>
  </div>
</nav>
<div class="toast" id="toast" hidden></div>

<script src="js/core.js?v=a8f35db6"></script>
<script src="js/grid.js?v=b825b823"></script>
<script src="js/diff.js?v=77ea70a1"></script>
<script src="js/mines.js?v=043ba7bb"></script>
<script src="js/words.js?v=c681bc69"></script>
<script src="js/survive.js?v=81abb439"></script>
<script src="js/colony.js?v=d1cfdc75"></script>
<script src="js/colony2.js?v=b219d3db"></script>
<script src="js/colony3.js?v=70796c14"></script>
<script src="js/colony4.js?v=f3630eb5"></script>
<script src="js/hub.js?v=a14de281"></script>

</body>
</html>
