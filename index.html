<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مساعدي">
<meta name="theme-color" content="#0f7a62">
<title>مساعدي الخاص</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f3f5f4; --surface:#ffffff; --fg:#17201d; --muted:#5d6b66; --line:#dde3e0;
  --accent:#0f7a62; --accent-fg:#ffffff; --user:#e3efe9; --danger:#b3261e;
  --display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#101614; --surface:#18201d; --fg:#e7eeeb; --muted:#93a39d; --line:#2a3531;
  --accent:#3fbf9b; --accent-fg:#06231b; --user:#1f3a31; --danger:#f2b8b5; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.7;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}

header{display:flex;align-items:center;gap:10px;padding-block:12px;border-bottom:1px solid var(--line)}
.mark{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-fg);
  display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px;flex:none}
.title{flex:1;min-width:0;font-family:var(--display);font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ghost{background:transparent;border:1px solid var(--line);color:var(--fg);font:inherit;font-size:14px;
  padding:6px 12px;border-radius:999px;cursor:pointer;flex:none}
.ghost:hover{border-color:var(--accent)}

#thread{flex:1;overflow-y:auto;padding-block:20px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:88%;min-width:0;overflow-wrap:anywhere}
.msg.user{align-self:flex-start;background:var(--user);padding:10px 14px;border-radius:16px 16px 4px 16px;white-space:pre-wrap}
.msg.bot{align-self:stretch;max-width:100%}
.msg.bot p{margin:0 0 .6em}.msg.bot p:last-child{margin:0}
.msg.bot ul,.msg.bot ol{margin:0 0 .6em;padding-inline-start:1.3em}
.msg.bot pre{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;direction:ltr;text-align:left;font-size:14px}
.msg.bot code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9em}
.msg.bot :not(pre)>code{background:var(--surface);border:1px solid var(--line);padding:0 4px;border-radius:4px}
.msg.bot h3{font-family:var(--display);font-size:18px;margin:.4em 0 .3em}
.thinking{color:var(--muted)}
.note{color:var(--danger);font-size:14px;margin-top:6px}

.welcome{display:flex;flex-direction:column;gap:16px;padding-block:24px 8px}
.welcome h1{font-family:var(--display);font-size:30px;margin:0;line-height:1.3;text-wrap:balance}
.welcome p{margin:0;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:1px solid var(--line);color:var(--fg);font:inherit;font-size:15px;
  padding:8px 14px;border-radius:12px;cursor:pointer;text-align:right}
.chip:hover{border-color:var(--accent)}

form#composer{display:flex;gap:8px;align-items:flex-end;padding-block:10px 14px;border-top:1px solid var(--line);background:var(--bg)}
textarea,input,select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;width:100%}
textarea{flex:1;min-width:0;resize:none;max-height:160px;border-radius:14px}
textarea:focus,input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.btn{flex:none;height:46px;min-width:64px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-fg);
  font:inherit;font-weight:600;cursor:pointer;padding:0 16px}
.btn:disabled{opacity:.5;cursor:default}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* settings */
#settings{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:20;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet{max-width:560px;margin:0 auto;padding-block:20px 40px;display:flex;flex-direction:column;gap:18px}
.sheet h2{font-family:var(--display);font-size:24px;margin:0}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:15px}
.field small{color:var(--muted);font-size:13px;line-height:1.6}
.field small a{color:var(--accent)}
.row{display:flex;gap:8px}
</style>
</head>
<body>
<div class="app">
  <header class="pad">
    <div class="mark" id="markLetter" aria-hidden="true">م</div>
    <div class="title" id="titleName">مساعدي</div>
    <button class="ghost" id="newChat" type="button">جديدة</button>
    <button class="ghost" id="openSettings" type="button">الإعدادات</button>
  </header>
  <main id="thread" class="pad" aria-live="polite"></main>
  <form id="composer" class="pad">
    <textarea id="box" rows="1" placeholder="اكتب رسالتك..." aria-label="رسالتك"></textarea>
    <button class="btn" id="sendBtn" type="button">إرسال</button>
  </form>
</div>

<section id="settings" class="pad" hidden>
  <form class="sheet" id="settingsForm">
    <h2>الإعدادات</h2>
    <div class="field">
      <label for="apiKey">مفتاح Gemini API</label>
      <input id="apiKey" type="password" dir="ltr" autocomplete="off" placeholder="AIza...">
      <small>احصل عليه مجاناً من <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a> ثم الصقه هنا. يُحفظ على جهازك فقط.</small>
    </div>
    <div class="field">
      <label for="botName">اسم المساعد</label>
      <input id="botName" placeholder="مساعدي">
    </div>
    <div class="field">
      <label for="model">النموذج</label>
      <select id="model" dir="ltr">
        <option value="gemini-3.8-flash">gemini-3.8-flash (موصى به)</option>
        <option value="gemini-3.6-flash">gemini-3.6-flash</option>
        <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite (الأسرع)</option>
        <option value="custom">نموذج آخر...</option>
      </select>
      <input id="customModel" dir="ltr" placeholder="اكتب اسم النموذج" hidden>
    </div>
    <div class="field">
      <label for="persona">شخصية المساعد (اختياري)</label>
      <textarea id="persona" rows="3" placeholder="مثال: أنت معلم رياضيات صبور تشرح خطوة بخطوة."></textarea>
    </div>
    <div class="row">
      <button class="btn" type="submit" style="flex:1">حفظ</button>
      <button class="ghost" type="button" id="closeSettings">إلغاء</button>
    </div>
  </form>
</section>

<script>
const $=id=>document.getElementById(id);
const thread=$('thread'),box=$('box'),sendBtn=$('sendBtn'),form=$('composer');
const SUGGEST=["اكتب لي رسالة اعتذار مهذبة لمديري","اشرح لي الذكاء الاصطناعي ببساطة","خطة أسبوعية لتنظيم وقتي","اقترح أسماء لمشروع قهوة صغير"];
function load(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

const DEFAULT_KEY='';
let cfg=load('cfg',{key:DEFAULT_KEY,name:'مساعدي',model:'gemini-3.8-flash',persona:''});
if(!cfg.key)cfg.key=DEFAULT_KEY;
let turns=load('turns',[]),busy=false,ctl=null;

function botName(){return (cfg.name||'').trim()||'مساعدي'}
function applyName(){$('titleName').textContent=botName();$('markLetter').textContent=botName().charAt(0);document.title=botName()}
applyName();

function system(){
  return `أنت "${botName()}"، مساعد شخصي ذكي ولطيف. تحدّث بالعربية إلا إذا كتب المستخدم بلغة أو لهجة أخرى فجاريه. كن واضحاً ومباشراً ومفيداً، واجعل الإجابات مختصرة ما لم يُطلب التفصيل. استخدم Markdown بسيطاً عند الحاجة.`+(cfg.persona?.trim()?`\n\nتعليمات إضافية من المستخدم: ${cfg.persona.trim()}`:'');
}

function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function inline(s){return s.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')}
function md(src){
  const parts=src.split(/```[^\n]*\n?/);let out='';
  parts.forEach((p,i)=>{
    if(i%2){out+='<pre><code>'+esc(p.replace(/\n$/,''))+'</code></pre>';return}
    const lines=esc(p).split('\n');let list=null,para=[];
    const fP=()=>{if(para.length){out+='<p>'+inline(para.join('<br>'))+'</p>';para=[]}};
    const fL=()=>{if(list){out+=`</${list}>`;list=null}};
    for(const l of lines){let m;
      if(!l.trim()){fP();fL();continue}
      if(m=l.match(/^#{1,6}\s+(.*)/)){fP();fL();out+='<h3>'+inline(m[1])+'</h3>';continue}
      if(m=l.match(/^\s*[-*•]\s+(.*)/)){fP();if(list!=='ul'){fL();out+='<ul>';list='ul'}out+='<li>'+inline(m[1])+'</li>';continue}
      if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){fP();if(list!=='ol'){fL();out+='<ol>';list='ol'}out+='<li>'+inline(m[1])+'</li>';continue}
      fL();para.push(l)}
    fP();fL()});
  return out;
}
function bubble(role,text){const d=document.createElement('div');d.className='msg '+(role==='user'?'user':'bot');
  if(role==='user')d.textContent=text;else d.innerHTML=md(text);thread.appendChild(d);return d}
function scrollDown(){thread.scrollTop=thread.scrollHeight}

function render(){
  thread.innerHTML='';
  if(!turns.length){
    const w=document.createElement('section');w.className='welcome';
    const h=document.createElement('h1');h.textContent='أهلاً، أنا '+botName()+'. كيف أساعدك اليوم؟';
    const p=document.createElement('p');
    p.textContent=cfg.key?'اسألني أي شيء، أو ابدأ بأحد هذه الأمثلة:':'للبدء، افتح الإعدادات وأضف مفتاح Gemini المجاني.';
    w.append(h,p);
    if(cfg.key){const c=document.createElement('div');c.className='chips';
      SUGGEST.forEach(s=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=s;b.onclick=()=>send(s);c.appendChild(b)});w.appendChild(c)}
    else{const b=document.createElement('button');b.type='button';b.className='btn';b.style.alignSelf='flex-start';b.textContent='إضافة المفتاح';b.onclick=openSettings;w.appendChild(b)}
    thread.appendChild(w);return}
  turns.forEach(t=>bubble(t.role,t.content));scrollDown();
}
render();

function setBusy(b){busy=b;sendBtn.textContent=b?'إيقاف':'إرسال';sendBtn.disabled=false}
setBusy(false);
function grow(){box.style.height='auto';box.style.height=Math.min(box.scrollHeight,160)+'px'}
box.addEventListener('input',grow);
function onSend(){if(busy){ctl&&ctl.abort();return}send(box.value)}
sendBtn.addEventListener('click',e=>{e.preventDefault();onSend()});
box.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&matchMedia('(pointer:fine)').matches){e.preventDefault();onSend()}});
form.addEventListener('submit',e=>{e.preventDefault()});
$('newChat').onclick=()=>{if(busy&&ctl)ctl.abort();turns=[];save('turns',turns);render()};

function errText(status,msg){
  if(status===400&&/API key/i.test(msg))return 'المفتاح غير صحيح. تأكد منه في الإعدادات.';
  if(status===403)return 'المفتاح لا يملك صلاحية. أنشئ مفتاحاً جديداً من Google AI Studio.';
  if(status===404)return 'اسم النموذج غير موجود. اختر نموذجاً آخر من الإعدادات.';
  if(status===429)return 'وصلت إلى حد الاستخدام المجاني مؤقتاً. انتظر قليلاً ثم حاول.';
  if(status>=500)return 'خوادم Gemini مشغولة الآن. حاول بعد قليل.';
  return 'تعذّر الاتصال. تحقق من الإنترنت ثم أعد المحاولة.';
}

async function send(text){
  text=text.trim();if(!text||busy)return;
  if(!cfg.key){openSettings();return}
  if(!turns.length)thread.innerHTML='';
  turns.push({role:'user',content:text});save('turns',turns);
  bubble('user',text);box.value='';box.style.height='auto';
  const b=bubble('assistant','');b.innerHTML='<span class="thinking">يفكّر...</span>';scrollDown();
  ctl=new AbortController();setBusy(true);
  const history=turns.slice(-40);while(history.length&&history[0].role!=='user')history.shift();
  let answer='';
  try{
    const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(cfg.model)}:streamGenerateContent?alt=sse`,{
      method:'POST',signal:ctl.signal,
      headers:{'Content-Type':'application/json','x-goog-api-key':cfg.key},
      body:JSON.stringify({
        systemInstruction:{parts:[{text:system()}]},
        contents:history.map(t=>({role:t.role==='user'?'user':'model',parts:[{text:t.content}]}))
      })
    });
    if(!res.ok){let m='';try{m=(await res.json()).error?.message||''}catch(e){}throw{status:res.status,msg:m}}
    const reader=res.body.getReader(),dec=new TextDecoder();let buf='';
    while(true){
      const {value,done}=await reader.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n');buf=lines.pop();
      for(const line of lines){
        if(!line.startsWith('data:'))continue;
        try{const j=JSON.parse(line.slice(5));
          const t=(j.candidates?.[0]?.content?.parts||[]).filter(p=>!p.thought).map(p=>p.text||'').join('');
          if(t){answer+=t;b.innerHTML=md(answer);scrollDown()}
        }catch(e){}
      }
    }
    if(!answer)throw{status:0,msg:'empty',empty:true};
    turns.push({role:'assistant',content:answer});save('turns',turns);
  }catch(e){
    if(answer){turns.push({role:'assistant',content:answer});save('turns',turns)}
    else b.innerHTML='';
    if(e?.name==='AbortError'){if(!answer)b.remove()}
    else{const n=document.createElement('div');n.className='note';
      n.textContent=e?.empty?'لم يصل رد. جرّب صياغة مختلفة.':errText(e?.status||0,e?.msg||'');b.appendChild(n)}
  }finally{setBusy(false);scrollDown()}
}

/* settings */
const sel=$('model'),custom=$('customModel');
function openSettings(){
  $('apiKey').value=cfg.key||'';$('botName').value=cfg.name||'';$('persona').value=cfg.persona||'';
  const known=[...sel.options].some(o=>o.value===cfg.model);
  sel.value=known?cfg.model:'custom';custom.hidden=known;custom.value=known?'':cfg.model;
  $('settings').hidden=false;
}
sel.onchange=()=>{custom.hidden=sel.value!=='custom'};
$('openSettings').onclick=openSettings;
$('closeSettings').onclick=()=>{$('settings').hidden=true};
$('settingsForm').addEventListener('submit',e=>{
  e.preventDefault();
  cfg={key:$('apiKey').value.trim(),name:$('botName').value.trim(),persona:$('persona').value,
    model:sel.value==='custom'?(custom.value.trim()||'gemini-3.8-flash'):sel.value};
  save('cfg',cfg);applyName();$('settings').hidden=true;render();
});
</script>
</body>
</html>
