<title>قاعة المدار</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: hub of game cards -> one game screen (top bar, stats strip, stage, controls). Deliberately dark night-orbit identity. */
:root{
  --bg:#0b1618; --panel:#122326; --tile:#16292d; --tile-hi:#1d373b; --line:#24403f;
  --fg:#e8f1ee; --muted:#8aa39d; --pipe:#3a5853; --lit:#3fbf9b; --glow:rgba(63,191,155,.45);
  --gold:#f2b84b; --danger:#f2a09a; --blue:#7cc4f2;
  --display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:540px;margin:0 auto;padding-block:14px 22px;display:flex;flex-direction:column;gap:14px}

/* hub */
.hubhead{display:flex;align-items:flex-end;gap:12px}
.hubhead h1{font-family:var(--display);font-size:30px;margin:0;flex:1;line-height:1.2}
.hubhead h1 span{color:var(--gold)}
.total{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:600;font-variant-numeric:tabular-nums}
.total svg{width:18px;height:18px;fill:var(--gold)}
.hubsub{margin:0;color:var(--muted);font-size:14px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gcard{display:flex;flex-direction:column;gap:8px;text-align:right;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;min-width:0}
.gcard:hover{border-color:var(--lit)}
.gcard .gi{width:52px;height:52px;border-radius:14px;background:var(--tile);display:grid;place-items:center}
.gcard .gi svg{width:34px;height:34px}
.gcard b{font-size:17px}
.gcard small{color:var(--muted);font-size:13px;line-height:1.5}
.gcard .prog{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:auto;font-variant-numeric:tabular-nums}
.gcard .prog em{font-style:normal;color:var(--gold)}
.soon{grid-column:1/-1;border-style:dashed;cursor:default;flex-direction:row;align-items:center}
.soon:hover{border-color:var(--line)}

/* game screen */
.topbar{display:flex;align-items:center;gap:10px}
.topbar h2{font-family:var(--display);font-size:22px;margin:0;flex:1}
.icon{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;flex:none}
.icon svg{width:20px;height:20px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 4px;text-align:center;min-width:0}
.stat b{display:block;font-size:19px;font-variant-numeric:tabular-nums;font-weight:600;line-height:1.35;white-space:nowrap}
.stat small{font-size:11.5px;color:var(--muted)}
.stat.gold b{color:var(--gold)}
.stage{position:relative;width:100%}
.controls{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;min-width:88px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-size:15px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:default}
.btn.on{border-color:var(--gold);color:var(--gold)}
.btn.main{background:var(--lit);color:#062019;border-color:transparent;font-weight:600}
.help{font-size:13.5px;color:var(--muted);line-height:1.7;margin:0;text-align:center;text-wrap:balance}
.overlay{position:absolute;inset:0;background:rgba(8,16,18,.88);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px;z-index:5}
.overlay h3{font-family:var(--display);font-size:30px;margin:0}
.overlay p{margin:0;color:var(--muted)}
.overlay .btn{flex:none;width:210px}
.stars{display:flex;gap:6px}.stars svg{width:40px;height:40px}
.stars .on{fill:var(--gold)}.stars .off{fill:#2a3f40}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;white-space:nowrap;z-index:20}

/* grid game */
.gboard{display:grid;width:100%;aspect-ratio:1/1;gap:3px;direction:ltr;touch-action:manipulation}
.cell{position:relative;background:var(--tile);border-radius:8px;cursor:pointer;overflow:hidden;border:0;padding:0}
.cell svg{position:absolute;inset:0;width:100%;height:100%;transition:transform .18s ease}
.arm{stroke:var(--pipe);stroke-width:16;stroke-linecap:round;transition:stroke .2s}
.hub{fill:var(--pipe)}.lit .arm{stroke:var(--lit)}.lit .hub{fill:var(--lit)}
.lit svg{filter:drop-shadow(0 0 4px var(--glow))}
.node{fill:var(--tile);stroke:var(--pipe);stroke-width:7}.lit .node{fill:var(--gold);stroke:var(--gold)}
.gstar{fill:var(--gold)}
.hintflash{animation:hint .9s ease 2}
@keyframes hint{50%{box-shadow:inset 0 0 0 3px var(--gold)}}

/* sudoku */
.sboard{display:grid;grid-template-columns:repeat(9,1fr);width:100%;aspect-ratio:1/1;direction:ltr;border:2px solid var(--muted);border-radius:10px;overflow:hidden;background:var(--line);gap:1px}
.sc{background:var(--tile);border:0;padding:0;display:grid;place-items:center;font-size:clamp(16px,5vw,24px);font-variant-numeric:tabular-nums;cursor:pointer;position:relative;color:var(--lit)}
.sc.g{color:var(--fg);font-weight:600}
.sc.bR{box-shadow:inset -2px 0 0 var(--muted)}.sc.bB{box-shadow:inset 0 -2px 0 var(--muted)}.sc.bR.bB{box-shadow:inset -2px 0 0 var(--muted),inset 0 -2px 0 var(--muted)}
.sc.peer{background:#18302f}.sc.same{background:#23423d}.sc.sel{background:#2d5650}
.sc.bad{color:var(--danger)}
.notes{display:grid;grid-template-columns:repeat(3,1fr);width:100%;height:100%;font-size:clamp(8px,2.2vw,11px);color:var(--muted);line-height:1}
.notes span{display:grid;place-items:center}
.pad{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:5px;direction:ltr}
.pad button{height:48px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:20px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;padding:0}
.pad button small{font-size:10px;color:var(--muted);font-weight:400}
.pad button:disabled{opacity:.3}

/* canvases */
canvas{display:block;width:100%;border-radius:14px;touch-action:none}
.difflabel{font-size:12.5px;color:var(--muted);margin:6px 2px 4px}

/* memory */
.mboard{display:grid;gap:6px;direction:ltr;margin:0 auto}
.mc{border:0;padding:0;background:none;cursor:pointer;perspective:600px;min-width:0;height:100%;width:100%}
.mc .in{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.mc.up .in,.mc.done .in{transform:rotateY(180deg)}
.mc .f,.mc .b{position:absolute;inset:0;border-radius:12px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.mc .b{background:var(--tile);border:1px solid var(--line)}
.mc .b svg{width:44%;height:44%;opacity:.55}
.mc .f{background:#e9f3ef;transform:rotateY(180deg);font-size:var(--sym,30px)}
.mc.done .f{background:#cdebdf;box-shadow:0 0 0 3px var(--lit)}
@media (prefers-reduced-motion:reduce){.cell svg,.mc .in{transition:none}}
</style>
</head>
<body style="padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)">


<div class="wrap" dir="rtl" lang="ar">
  <!-- HUB -->
  <section id="hub">
    <div class="wrap" style="padding:0">
      <div class="hubhead">
        <h1>قاعة <span>المدار</span></h1>
        <div class="total" title="مجموع نجومك"><svg viewBox="0 0 100 100"><path d="M50 6c5 28 16 39 44 44-28 5-39 16-44 44-5-28-16-39-44-44 28-5 39-16 44-44z"/></svg><span id="totalStars">0</span></div>
      </div>
      <p class="hubsub">ألعاب تفكير بلا نهاية. كل مستوى أصعب من الذي قبله، وتقدّمك محفوظ دائماً.</p>
      <div class="cards" id="cards"></div>
    </div>
  </section>

  <!-- GAME -->
  <section id="play" hidden>
    <div class="wrap" style="padding:0">
      <div class="topbar">
        <button class="icon" id="back" type="button" aria-label="رجوع إلى القاعة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
        <h2 id="gTitle">لعبة</h2>
      </div>
      <div class="stats" id="stats"></div>
      <div class="stage" id="stage"></div>
      <div class="controls" id="ctrl"></div>
      <p class="help" id="help"></p>
    </div>
  </section>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ================= shared ================= */
const $=id=>document.getElementById(id);
function load(k,d){try{const v=localStorage.getItem(k);return v==null?d:Object.assign({},d,JSON.parse(v))}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,R){for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function toast(t){const el=$('toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,1800)}
const STAR='M50 6c5 28 16 39 44 44-28 5-39 16-44 44-5-28-16-39-44-44 28-5 39-16 44-44z';
function starSVG(on){return `<svg viewBox="0 0 100 100"><path class="${on?'on':'off'}" d="${STAR}"/></svg>`}
const IC={
  undo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l-5 5M15 14l-5-5M15 14H8a5 5 0 0 1 0-10h1"/></svg>',
  hint:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"/></svg>',
  reset:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>',
  erase:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H9L4 15l10-10 6 6-7 7M8 11l6 6"/></svg>',
  pen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/></svg>'
};
const stage=$('stage');
let active=null;
function setStats(items){$('stats').innerHTML=items.map(([id,label,cls])=>`<div class="stat ${cls||''}"><b id="${id}">-</b><small>${label}</small></div>`).join('')}
function setStat(id,v){const e=$(id);if(e)e.textContent=v}
function btn(label,icon,fn,cls){const b=document.createElement('button');b.type='button';b.className='btn '+(cls||'');b.innerHTML=(icon||'')+'<span></span>';b.lastChild.textContent=label;b.onclick=fn;$('ctrl').appendChild(b);return b}
function winBox({title,text,stars,onNext,label}){
  const o=document.createElement('div');o.className='overlay';
  o.innerHTML=`<h3></h3><div class="stars">${[1,2,3].map(k=>starSVG(k<=stars)).join('')}</div><p></p><button class="btn main" type="button"></button>`;
  o.querySelector('h3').textContent=title;o.querySelector('p').textContent=text;const b=o.querySelector('button');b.textContent=label||'المستوى التالي';
  b.onclick=()=>{o.remove();onNext()};setTimeout(()=>{stage.appendChild(o);b.focus()},300);
}
/* progress per game: {level, best, stars:{level:n}} */
function gState(id,extra){return load('arcade-'+id,Object.assign({level:1,best:1,stars:{}},extra||{}))}
function gSave(id,st){save('arcade-'+id,st)}
function award(id,st,level,stars){st.stars[level]=Math.max(st.stars[level]||0,stars);st.level=level+1;st.best=Math.max(st.best,st.level);gSave(id,st)}
function starTotal(st){return Object.values(st.stars||{}).reduce((a,b)=>a+b,0)}

/* ================= game 1: orbit grid ================= */
const GridGame=(()=>{
  const N=1,E=2,S=4,W=8,DIRS=[[N,0,-1,S],[E,1,0,W],[S,0,1,N],[W,-1,0,E]];
  const rot=m=>((m<<1)|(m>>3))&15,rotK=(m,k)=>{for(let i=0;i<k;i++)m=rot(m);return m};
  let st,g,board;
  const sizeFor=l=>Math.min(4+Math.floor((l-1)/3),9);
  function build(level){
    const n=sizeFor(level),R=rng(level*7919+13),sol=new Array(n*n).fill(0),seen=new Array(n*n).fill(false);
    const src=Math.floor(n/2)*n+Math.floor(n/2),front=[src];seen[src]=true;
    while(front.length){const idx=R()<(level<6?0.75:0.5)?front.length-1:Math.floor(R()*front.length);const c=front[idx],x=c%n,y=(c/n)|0;
      const opts=DIRS.filter(([,dx,dy])=>{const nx=x+dx,ny=y+dy;return nx>=0&&ny>=0&&nx<n&&ny<n&&!seen[ny*n+nx]});
      if(!opts.length){front.splice(idx,1);continue}
      const [b,dx,dy,ob]=opts[Math.floor(R()*opts.length)],nc=(y+dy)*n+x+dx;sol[c]|=b;sol[nc]|=ob;seen[nc]=true;front.push(nc)}
    const r=sol.map(()=>Math.floor(R()*4));if(r.every((k,i)=>rotK(sol[i],k)===sol[i]))r[(src+1)%(n*n)]=1;
    return {n,sol,rot:r,src,moves:0,hist:[],angle:r.map(k=>k*90),level};
  }
  const cur=i=>rotK(g.sol[i],g.rot[i]);
  function minRot(i){const c=cur(i);for(let k=0;k<4;k++)if(rotK(c,k)===g.sol[i])return k;return 0}
  function lit(){const n=g.n,L=new Set([g.src]),q=[g.src];while(q.length){const c=q.shift(),x=c%n,y=(c/n)|0,m=cur(c);
    for(const [b,dx,dy,ob] of DIRS){if(!(m&b))continue;const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=n||ny>=n)continue;const nc=ny*n+nx;if(!L.has(nc)&&(cur(nc)&ob)){L.add(nc);q.push(nc)}}}return L}
  function svg(mask,isSrc){
    const P={[N]:[50,0],[E]:[100,50],[S]:[50,100],[W]:[0,50]};
    const arms=[N,E,S,W].filter(b=>mask&b).map(b=>`<line class="arm" x1="50" y1="50" x2="${P[b][0]}" y2="${P[b][1]}"/>`).join('');
    const leaf=[N,E,S,W].filter(b=>mask&b).length===1;
    return `<svg viewBox="0 0 100 100" aria-hidden="true">${arms}${isSrc?'<path class="gstar" d="M50 22c3 17 11 25 28 28-17 3-25 11-28 28-3-17-11-25-28-28 17-3 25-11 28-28z"/>':leaf?'<circle class="node" cx="50" cy="50" r="17"/>':'<circle class="hub" cx="50" cy="50" r="9"/>'}</svg>`;
  }
  function refresh(){const L=lit();[...board.children].forEach((c,i)=>c.classList.toggle('lit',L.has(i)));
    setStat('s1',g.level);setStat('s2',g.moves);setStat('s3',g.par);setStat('s4',st.hints);
    ub.disabled=!g.hist.length;hb.disabled=!st.hints;return L.size===g.sol.length}
  function turn(i,rec=true){g.rot[i]=(g.rot[i]+1)%4;g.angle[i]+=90;board.children[i].firstChild.style.transform=`rotate(${g.angle[i]}deg)`;if(rec){g.moves++;g.hist.push(i)}if(refresh())done()}
  function done(){g.over=true;const m=g.moves,p=g.par,s=m<=p?3:m<=Math.ceil(p*1.5)?2:1;const earned=g.level%3===0;if(earned)st.hints++;
    award('grid',st,g.level,s);winBox({title:s===3?'مثالي!':'اكتمل المدار!',text:`${m} حركة (الحد الأدنى ${p})`+(earned?' · كسبت تلميحاً':'')+(sizeFor(g.level+1)>g.n?' · اللوحة تكبر':''),stars:s,onNext:()=>play(st.level)})}
  function play(level){g=build(level);g.par=g.sol.reduce((a,_,i)=>a+minRot(i),0);
    board.style.gridTemplateColumns=`repeat(${g.n},1fr)`;board.innerHTML='';
    g.sol.forEach((m,i)=>{const c=document.createElement('button');c.type='button';c.className='cell';c.dataset.i=i;c.setAttribute('aria-label','قطعة');c.innerHTML=svg(m,i===g.src);c.firstChild.style.transform=`rotate(${g.angle[i]}deg)`;board.appendChild(c)});refresh()}
  let ub,hb;
  return {id:'grid',name:'شبكة المدار',desc:'دوّر القطع حتى تضيء الشبكة كلها',
    icon:'<svg viewBox="0 0 48 48"><g stroke="#3fbf9b" stroke-width="5" stroke-linecap="round" fill="none"><path d="M24 24V8M24 24h16M24 24v16M24 24H10"/></g><path fill="#f2b84b" d="M24 14c1.6 6.5 3.5 8.4 10 10-6.5 1.6-8.4 3.5-10 10-1.6-6.5-3.5-8.4-10-10 6.5-1.6 8.4-3.5 10-10z"/></svg>',
    help:'اضغط أي قطعة لتدويرها. وصّل كل الأنابيب بالنجمة الذهبية حتى تضيء كل النقاط. أقل عدد حركات يعطيك 3 نجوم، وكل 3 مستويات تكسب تلميحاً.',
    progress(){const s=gState('grid',{hints:3});return {level:s.level,stars:starTotal(s)}},
    start(){st=gState('grid',{hints:3});setStats([['s1','المستوى'],['s2','حركاتك'],['s3','الحد الأدنى','gold'],['s4','تلميحات']]);
      board=document.createElement('div');board.className='gboard';stage.appendChild(board);
      board.onclick=e=>{const c=e.target.closest('.cell');if(c&&!g.over)turn(+c.dataset.i)};
      ub=btn('تراجع',IC.undo,()=>{if(!g.hist.length||g.over)return;const i=g.hist.pop();g.rot[i]=(g.rot[i]+3)%4;g.angle[i]-=90;g.moves--;board.children[i].firstChild.style.transform=`rotate(${g.angle[i]}deg)`;refresh()});
      hb=btn('تلميح',IC.hint,()=>{if(!st.hints||g.over)return;const L=lit(),n=g.n,wrong=g.sol.map((_,i)=>i).filter(i=>minRot(i)>0);if(!wrong.length)return;
        const near=wrong.filter(i=>DIRS.some(([,dx,dy])=>{const x=i%n+dx,y=((i/n)|0)+dy;return x>=0&&y>=0&&x<n&&y<n&&L.has(y*n+x)}));
        const i=(near.length?near:wrong)[0];st.hints--;gSave('grid',st);const el=board.children[i];el.classList.remove('hintflash');void el.offsetWidth;el.classList.add('hintflash');
        const k=minRot(i);for(let j=0;j<k;j++)turn(i)});
      btn('إعادة',IC.reset,()=>play(g.level));play(st.level)},
    stop(){}};
})();

/* ================= game 2: sudoku ================= */
const SudokuGame=(()=>{
  let st,p,boardEl,padEl,sel=-1,notesMode=false,nb;
  const peers=i=>{const r=(i/9)|0,c=i%9,br=r-r%3,bc=c-c%3,o=[];for(let k=0;k<9;k++){o.push(r*9+k,k*9+c,(br+((k/3)|0))*9+bc+k%3)}return o};
  function solve(b,limit,R){
    const rows=new Array(9).fill(0),cols=new Array(9).fill(0),box=new Array(9).fill(0);let count=0;
    for(let i=0;i<81;i++)if(b[i]){const r=(i/9)|0,c=i%9,m=1<<b[i];rows[r]|=m;cols[c]|=m;box[(r/3|0)*3+(c/3|0)]|=m}
    (function rec(){let best=-1,bm=0,bn=10;
      for(let i=0;i<81;i++)if(!b[i]){const r=(i/9)|0,c=i%9,m=~(rows[r]|cols[c]|box[(r/3|0)*3+(c/3|0)])&0x3FE;let n=0;for(let d=1;d<10;d++)if(m&(1<<d))n++;if(n<bn){bn=n;best=i;bm=m;if(!n)return}}
      if(best<0){count++;return}
      const r=(best/9)|0,c=best%9,bx=(r/3|0)*3+(c/3|0);let ds=[1,2,3,4,5,6,7,8,9];if(R)ds=shuffle(ds,R);
      for(const d of ds){if(!(bm&(1<<d)))continue;const m=1<<d;b[best]=d;rows[r]|=m;cols[c]|=m;box[bx]|=m;rec();if(count>=limit)return;b[best]=0;rows[r]&=~m;cols[c]&=~m;box[bx]&=~m}
    })();return count}
  function generate(level){
    const R=rng(level*1013+77),full=new Array(81).fill(0);solve(full,1,R);
    const target=Math.max(24,44-level),puz=full.slice(),order=shuffle([...Array(81).keys()],R);let clues=81;
    for(const i of order){if(clues<=target)break;const k=puz[i];puz[i]=0;if(solve(puz.slice(),2)!==1)puz[i]=k;else clues--}
    return {level,sol:full,giv:puz,cur:puz.slice(),notes:new Array(81).fill(0),mistakes:0,hints:0};
  }
  function persist(){st.cur=p;gSave('sudoku',st)}
  function render(){
    const cells=boardEl.children,sv=sel>=0?p.cur[sel]:0,pr=sel>=0?new Set(peers(sel)):new Set();
    for(let i=0;i<81;i++){const c=cells[i],v=p.cur[i];
      c.className='sc'+(p.giv[i]?' g':'')+((i%9===2||i%9===5)?' bR':'')+((((i/9)|0)===2||((i/9)|0)===5)?' bB':'')+(pr.has(i)?' peer':'')+(sv&&v===sv?' same':'')+(i===sel?' sel':'')+(v&&v!==p.sol[i]?' bad':'');
      if(v)c.textContent=v;else if(p.notes[i]){c.innerHTML='<div class="notes">'+[1,2,3,4,5,6,7,8,9].map(d=>`<span>${p.notes[i]&(1<<d)?d:''}</span>`).join('')+'</div>'}else c.textContent=''}
    const cnt=new Array(10).fill(0);p.cur.forEach((v,i)=>{if(v&&v===p.sol[i])cnt[v]++});
    [...padEl.children].forEach((b,k)=>{const left=9-cnt[k+1];b.disabled=left<=0;b.lastChild.textContent=left>0?left:''});
    setStat('s1',p.level);setStat('s2',p.cur.filter(v=>!v).length);setStat('s3',p.mistakes);setStat('s4',st.hints);
    nb.classList.toggle('on',notesMode);
  }
  function put(d){
    if(sel<0||p.giv[sel]||p.over)return;
    if(notesMode&&d){if(p.cur[sel])return;p.notes[sel]^=(1<<d);render();persist();return}
    if(!d){p.cur[sel]=0;p.notes[sel]=0;render();persist();return}
    p.cur[sel]=d;p.notes[sel]=0;
    if(d!==p.sol[sel]){p.mistakes++;toast('رقم غير صحيح')}else peers(sel).forEach(j=>{p.notes[j]&=~(1<<d)});
    render();persist();
    if(p.cur.every((v,i)=>v===p.sol[i]))finish();
  }
  function finish(){p.over=true;const s=p.mistakes===0&&p.hints===0?3:p.mistakes+p.hints<=2?2:1;const earned=p.level%2===0;if(earned)st.hints++;
    st.cur=null;award('sudoku',st,p.level,s);
    winBox({title:'أحسنت!',text:`أخطاء: ${p.mistakes} · تلميحات: ${p.hints}`+(earned?' · كسبت تلميحاً':''),stars:s,onNext:()=>play(st.level)})}
  function play(level){
    stage.querySelectorAll('.overlay').forEach(o=>o.remove());
    if(st.cur&&st.cur.level===level&&!st.cur.over)p=st.cur;else{p=generate(level);persist()}
    sel=p.cur.findIndex(v=>!v);render();
  }
  return {id:'sudoku',name:'سودوكو',desc:'املأ الأرقام 1-9 بدون تكرار',

/* ================= game 3: mini golf ================= */
const GolfGame=(()=>{
  const W=300,H=420,BR=6,HR=10;
  let st,cv,ctx,L,ball,raf=0,drag=null,scale=1,sunk=false;
  function overlaps(a,b,m){return a.x-m<b.x+b.w&&a.x+a.w+m>b.x&&a.y-m<b.y+b.h&&a.y+a.h+m>b.y}
  function build(level){
    const R=rng(level*313+7),start={x:150,y:385},hole={x:45+R()*210,y:40+R()*70},walls=[],sand=[],water=[];
    const zoneS={x:start.x-28,y:start.y-28,w:56,h:56},zoneH={x:hole.x-30,y:hole.y-30,w:60,h:60};
    const nW=Math.min(1+level,10);let tries=0;

      const w={x:15+R()*(W-30),y:70+R()*(H-150),w:horiz?len:12,h:horiz?12:len};if(w.x+w.w>W-10)w.x=W-10-w.w;if(w.y+w.h>H-80)w.y=H-80-w.h;
      if(overlaps(w,zoneS,0)||overlaps(w,zoneH,0)||walls.some(o=>overlaps(w,o,22)))continue;walls.push(w)}
    if(level>=3){const n=level>=8?2:1;for(let k=0;k<n;k++){const s={x:20+R()*(W-120),y:90+R()*(H-200),w:60+R()*50,h:40+R()*40};if(!overlaps(s,zoneS,4))sand.push(s)}}
    if(level>=6){tries=0;const n=level>=12?2:1;while(water.length<n&&tries++<200){const w={x:20+R()*(W-110),y:110+R()*(H-230),w:50+R()*50,h:30+R()*30};
      if(overlaps(w,zoneS,14)||overlaps(w,zoneH,14)||walls.some(o=>overlaps(w,o,8)))continue;water.push(w)}}
    const par=2+Math.floor(nW/4)+(water.length?1:0);
    return {level,start,hole,walls,sand,water,par,strokes:0};
  }
  const inR=(p,r)=>p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;
  function resize(){const w=stage.clientWidth;scale=w/W;cv.width=Math.round(w*devicePixelRatio);cv.height=Math.round(w*H/W*devicePixelRatio);cv.style.height=(w*H/W)+'px';ctx.setTransform(scale*devicePixelRatio,0,0,scale*devicePixelRatio,0,0)}
  function pos(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}

    if(ball.moving){

        ball.x+=ball.vx/3;ball.y+=ball.vy/3;
        const rects=L.walls.concat([{x:-40,y:-40,w:W+80,h:40},{x:-40,y:H,w:W+80,h:40},{x:-40,y:0,w:40,h:H},{x:W,y:0,w:40,h:H}]);
        for(const w of rects){const cx=Math.max(w.x,Math.min(ball.x,w.x+w.w)),cy=Math.max(w.y,Math.min(ball.y,w.y+w.h));let dx=ball.x-cx,dy=ball.y-cy,d=Math.hypot(dx,dy);
          if(d<BR){if(d===0){dx=-ball.vx;dy=-ball.vy;d=Math.hypot(dx,dy)||1}const nx=dx/d,ny=dy/d;ball.x=cx+nx*BR;ball.y=cy+ny*BR;const dot=ball.vx*nx+ball.vy*ny;if(dot<0){ball.vx-=1.8*dot*nx;ball.vy-=1.8*dot*ny}}}
      }
      const f=L.sand.some(r=>inR(ball,r))?0.93:0.985;ball.vx*=f;ball.vy*=f;
      const dh=Math.hypot(ball.x-L.hole.x,ball.y-L.hole.y),sp=Math.hypot(ball.vx,ball.vy);
      if(dh<HR+3){ball.vx+=(L.hole.x-ball.x)*0.04;ball.vy+=(L.hole.y-ball.y)*0.04}

      else if(L.water.some(r=>inR(ball,r))){ball.moving=false;L.strokes++;ball.x=ball.lx;ball.y=ball.ly;toast('سقطت في الماء! +1 ضربة');upd()}

    ctx.fillStyle='#0c1d14';ctx.beginPath();ctx.arc(L.hole.x,L.hole.y,HR,0,7);ctx.fill();
    ctx.strokeStyle='#e8f1ee';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(L.hole.x,L.hole.y);ctx.lineTo(L.hole.x,L.hole.y-34);ctx.stroke();
    ctx.fillStyle='#f2b84b';ctx.beginPath();ctx.moveTo(L.hole.x,L.hole.y-34);ctx.lineTo(L.hole.x+18,L.hole.y-28);ctx.lineTo(L.hole.x,L.hole.y-22);ctx.fill();

      ctx.strokeStyle=`rgba(242,184,75,${.5+k*.5})`;ctx.lineWidth=3;ctx.setLineDash([6,6]);ctx.beginPath();ctx.moveTo(ball.x,ball.y);ctx.lineTo(ball.x+Math.cos(a)*len*1.2,ball.y+Math.sin(a)*len*1.2);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(10,H-16,W-20,6);ctx.fillStyle=k>.8?'#f2a09a':'#f2b84b';ctx.fillRect(10,H-16,(W-20)*k,6)}}
    if(!sunk){ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.arc(ball.x+1.5,ball.y+2,BR,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,BR,0,7);ctx.fill()}
  }
  function upd(){setStat('s1',L.level);setStat('s2',L.strokes);setStat('s3',L.par);setStat('s4',L.walls.length)}
  function finish(){const d=L.strokes-L.par,s=d<=0?3:d===1?2:1;award('golf',st,L.level,s);
    const name=L.strokes===1?'ضربة واحدة! 🏆':d<=-2?'إيغل!':d===-1?'بيردي!':d===0?'بار':d===1?'بوغي':'أكملت الحفرة';
    winBox({title:name,text:`${L.strokes} ضربة · البار ${L.par}`,stars:s,onNext:()=>play(st.level)})}
  function play(level){stage.querySelectorAll('.overlay').forEach(o=>o.remove());L=build(level);sunk=false;ball={x:L.start.x,y:L.start.y,vx:0,vy:0,moving:false,lx:L.start.x,ly:L.start.y};upd()}
  return {id:'golf',name:'جولف المدار',desc:'اسحب واضرب الكرة نحو الحفرة',
    icon:'<svg viewBox="0 0 48 48"><circle cx="24" cy="38" r="7" fill="#0c1d14"/><path d="M24 38V8" stroke="#e8f1ee" stroke-width="2.5"/><path d="M24 8l13 5-13 5z" fill="#f2b84b"/><circle cx="12" cy="30" r="4.5" fill="#fff"/></svg>',
    help:'اسحب إصبعك من أي مكان بعكس اتجاه الضربة (مثل المقلاع)، وكلما سحبت أكثر زادت القوة، ثم اترك. الرمل يبطئ الكرة، والماء يعيدك ويضيف ضربة.',
    progress(){const s=gState('golf');return {level:s.level,stars:starTotal(s)}},
    start(){st=gState('golf');setStats([['s1','الحفرة'],['s2','ضرباتك'],['s3','البار','gold'],['s4','حواجز']]);
      cv=document.createElement('canvas');stage.appendChild(cv);ctx=cv.getContext('2d');resize();this.rs=()=>{resize()};addEventListener('resize',this.rs);
      cv.onpointerdown=e=>{if(ball.moving||sunk)return;const p=pos(e);drag={sx:p.x,sy:p.y,x:p.x,y:p.y};cv.setPointerCapture(e.pointerId)};
      cv.onpointermove=e=>{if(!drag)return;const p=pos(e);drag.x=p.x;drag.y=p.y};
      cv.onpointerup=cv.onpointercancel=e=>{if(!drag)return;const dx=drag.sx-drag.x,dy=drag.sy-drag.y,len=Math.min(Math.hypot(dx,dy),130);drag=null;
        if(len<8)return;const pw=len/130*10.5;ball.lx=ball.x;ball.ly=ball.y;ball.vx=dx/Math.hypot(dx,dy)*pw;ball.vy=dy/Math.hypot(dx,dy)*pw;ball.moving=true;L.strokes++;upd()};
      btn('إعادة الحفرة',IC.reset,()=>play(L.level));play(st.level);raf=requestAnimationFrame(step)},

/* ================= game 4: spot the difference ================= */
const DiffGame=(()=>{
  const W=400,H=260;let st,g,cA,cB,xA,xB,wrongMark=null;
  const HUES=[4,28,48,88,150,190,215,265,300,330];
  const col=c=>`hsl(${c.h} ${c.s}% ${c.l}%)`;
  function build(level){
    const R=rng(level*977+5),M=Math.min(9+level,26),D=Math.min(3+Math.floor(level/2),8);
    const cols=Math.ceil(Math.sqrt(M*W/H)),rows=Math.ceil(M/cols),cw=W/cols,ch=H/rows;
    const slots=shuffle([...Array(cols*rows).keys()],R).slice(0,M);
    const types=['circle','square','tri','star','ring','diamond','plus'];
    const shapes=slots.map(k=>{const cx=(k%cols+0.5)*cw,cy=(((k/cols)|0)+0.5)*ch,r=Math.min(cw,ch)*(0.24+R()*0.14);
      return {x:cx+(R()-.5)*cw*0.3,y:cy+(R()-.5)*ch*0.3,r,t:types[Math.floor(R()*types.length)],c:{h:HUES[Math.floor(R()*HUES.length)],s:65+R()*20,l:50+R()*12},a:R()*Math.PI}});
    const bgH=HUES[Math.floor(R()*HUES.length)];
    const picks=shuffle(shapes.map((_,i)=>i),R).slice(0,D),subtle=level>=7;
    const B=shapes.map(s=>Object.assign({},s,{c:Object.assign({},s.c)}));const diffs=[];
    picks.forEach(i=>{const kinds=['color','remove','size','type'];const kind=kinds[Math.floor(R()*kinds.length)];const s=B[i];
      if(kind==='color'){if(subtle)s.c.l=s.c.l>55?s.c.l-20:s.c.l+20;else s.c.h=(s.c.h+120+Math.floor(R()*120))%360}
      else if(kind==='remove')s.gone=true;
      else if(kind==='size')s.r*=subtle?(R()<.5?0.7:1.3):(R()<.5?0.55:1.55);
      else{let t;do{t=types[Math.floor(R()*types.length)]}while(t===s.t);s.t=t}
      diffs.push({x:shapes[i].x,y:shapes[i].y,r:Math.max(shapes[i].r,s.r),found:false})});

    else if(s.t==='diamond'){ctx.moveTo(0,-r);ctx.lineTo(r*.75,0);ctx.lineTo(0,r);ctx.lineTo(-r*.75,0);ctx.closePath()}

    ctx.fillStyle=`hsl(${g.bg.h} 30% 86%)`;for(let x=0;x<W;x+=40)for(let y=(x/40)%2*20;y<H;y+=40)ctx.fillRect(x,y,20,20);

    g.diffs.forEach(d=>{if(!d.found&&!d.hint)return;ctx.strokeStyle=d.found?'#0f7a62':'#f2b84b';ctx.lineWidth=4;ctx.setLineDash(d.found?[]:[6,5]);ctx.beginPath();ctx.arc(d.x,d.y,d.r+9,0,7);ctx.stroke();ctx.setLineDash([])});
    if(wrongMark){ctx.strokeStyle='#d64545';ctx.lineWidth=5;const {x,y}=wrongMark;ctx.beginPath();ctx.moveTo(x-10,y-10);ctx.lineTo(x+10,y+10);ctx.moveTo(x+10,y-10);ctx.lineTo(x-10,y+10);ctx.stroke()}

  function draw(){paint(xA,g.A);paint(xB,g.B)}
  function size(c,x){const w=stage.clientWidth;c.width=Math.round(w*devicePixelRatio);c.height=Math.round(w*H/W*devicePixelRatio);c.style.height=(w*H/W)+'px';x.setTransform(w/W*devicePixelRatio,0,0,w/W*devicePixelRatio,0,0)}
  function upd(){setStat('s1',g.level);setStat('s2',g.diffs.filter(d=>d.found).length+'/'+g.diffs.length);setStat('s3',g.mistakes);setStat('s4',st.hints)}

  function play(level){stage.querySelectorAll('.overlay').forEach(o=>o.remove());g=build(level);draw();upd()}

    icon:'<svg viewBox="0 0 48 48"><rect x="4" y="8" width="18" height="32" rx="4" fill="#e9f3ef"/><rect x="26" y="8" width="18" height="32" rx="4" fill="#e9f3ef"/><circle cx="13" cy="18" r="4" fill="#3fbf9b"/><circle cx="35" cy="18" r="4" fill="#f2b84b"/><rect x="9" y="27" width="8" height="8" fill="#7cc4f2"/><rect x="31" y="27" width="8" height="8" fill="#7cc4f2"/></svg>',
    help:'الصورتان متشابهتان إلا في بعض التفاصيل: لون، أو حجم، أو شكل، أو شيء مفقود. اضغط مكان الاختلاف في أي صورة. الضغط الخاطئ يُحسب خطأ.',
    progress(){const s=gState('diff',{hints:3});return {level:s.level,stars:starTotal(s)}},
    start(){st=gState('diff',{hints:3});setStats([['s1','المستوى'],['s2','وجدت','gold'],['s3','أخطاء'],['s4','تلميحات']]);
      const la=document.createElement('div');la.className='difflabel';la.textContent='الصورة الأصلية';
      const lb=document.createElement('div');lb.className='difflabel';lb.textContent='الصورة المعدّلة';
      cA=document.createElement('canvas');cB=document.createElement('canvas');xA=cA.getContext('2d');xB=cB.getContext('2d');

/* ================= game 5: memory ================= */
const MemoryGame=(()=>{
  const SYM=['🍎','🍋','🍇','🍉','🥝','🍒','🌙','⭐','🐪','🦅','🐬','🌴','⚓','🎯','🔑','🚀','🌵','🦋'];
  let st,g,boardEl,lock=false;
  function build(level){const R=rng(level*541+3),pairs=Math.min(5+level,18),syms=shuffle(SYM.slice(),R).slice(0,pairs);
    return {level,pairs,cards:shuffle(syms.concat(syms),R).map(s=>({s,done:false})),open:[],moves:0,found:0}}
  function fit(){
    if(!g||!boardEl)return;const n=g.cards.length,gap=6,ratio=1.25;

    let best={w:0,c:4};
    for(let c=3;c<=8;c++){const r=Math.ceil(n/c);const w=Math.min((availW-gap*(c-1))/c,((availH-gap*(r-1))/r)/ratio);if(w>best.w)best={w,c}}

    boardEl.style.width=(best.c*w+gap*(best.c-1))+'px';boardEl.style.setProperty('--sym',Math.round(w*0.5)+'px');
  }
  function upd(){setStat('s1',g.level);setStat('s2',g.moves);setStat('s3',g.found+'/'+g.pairs);setStat('s4',Math.round(g.pairs*1.6))}
  function flip(i){if(lock||g.over)return;const c=g.cards[i],el=boardEl.children[i];if(c.done||g.open.includes(i))return;
    el.classList.add('up');g.open.push(i);
    if(g.open.length===2){g.moves++;const [a,b]=g.open;
      if(g.cards[a].s===g.cards[b].s){g.cards[a].done=g.cards[b].done=true;boardEl.children[a].classList.add('done');boardEl.children[b].classList.add('done');g.open=[];g.found++;
        if(g.found===g.pairs){g.over=true;const s=g.moves<=Math.round(g.pairs*1.6)?3:g.moves<=Math.round(g.pairs*2.3)?2:1;award('memory',st,g.level,s);
          winBox({title:'ذاكرة قوية!',text:`${g.moves} محاولة لـ ${g.pairs} أزواج`,stars:s,onNext:()=>play(st.level)})}}
      else{lock=true;setTimeout(()=>{boardEl.children[a].classList.remove('up');boardEl.children[b].classList.remove('up');g.open=[];lock=false},750)}}
    upd()}
  function play(level){stage.querySelectorAll('.overlay').forEach(o=>o.remove());g=build(level);lock=false;
    boardEl.innerHTML='';
    g.cards.forEach((c,i)=>{const b=document.createElement('button');b.type='button';b.className='mc';b.setAttribute('aria-label','بطاقة');
      b.innerHTML=`<div class="in"><div class="b"><svg viewBox="0 0 100 100"><ellipse cx="50" cy="50" rx="44" ry="18" fill="none" stroke="#3fbf9b" stroke-width="6" transform="rotate(-30 50 50)"/><path fill="#f2b84b" d="M50 28c2.6 13 9 19.4 22 22-13 2.6-19.4 9-22 22-2.6-13-9-19.4-22-22 13-2.6 19.4-9 22-22z"/></svg></div><div class="f">${c.s}</div></div>`;
      b.onclick=()=>flip(i);boardEl.appendChild(b)});
    fit();upd();
    if(level<=4){lock=true;[...boardEl.children].forEach(b=>b.classList.add('up'));setTimeout(()=>{[...boardEl.children].forEach(b=>b.classList.remove('up'));lock=false},1200+level*250)}
  }
  return {id:'memory',name:'الذاكرة',desc:'اقلب البطاقات وطابق الأزواج',
    icon:'<svg viewBox="0 0 48 48"><rect x="5" y="9" width="17" height="24" rx="3" fill="#16292d" stroke="#3fbf9b" stroke-width="2"/><rect x="26" y="15" width="17" height="24" rx="3" fill="#e9f3ef"/><path fill="#f2b84b" d="M34.5 21c1 4.5 2.4 5.9 7 7-4.6 1-6 2.4-7 7-1-4.6-2.4-6-7-7 4.6-1.1 6-2.5 7-7z" transform="translate(-0.5 -1)"/></svg>',
    help:'اقلب بطاقتين في كل محاولة. إذا تطابقتا تبقيان مفتوحتين. في المستويات الأولى ترى البطاقات لحظة في البداية، ثم يزيد عدد الأزواج وتختفي المساعدة.',
    progress(){const s=gState('memory');return {level:s.level,stars:starTotal(s)}},
    start(){st=gState('memory');setStats([['s1','المستوى'],['s2','محاولات'],['s3','أزواج','gold'],['s4','هدف 3 نجوم']]);
      boardEl=document.createElement('div');boardEl.className='mboard';stage.appendChild(boardEl);btn('إعادة',IC.reset,()=>play(g.level));play(st.level);
      this.rs=()=>fit();addEventListener('resize',this.rs)},
    stop(){removeEventListener('resize',this.rs)}};
})();

/* ================= hub ================= */
const GAMES=[GridGame,SudokuGame,GolfGame,DiffGame,MemoryGame];
function renderHub(){
  let total=0;const cards=$('cards');cards.innerHTML='';
  GAMES.forEach(G=>{const p=G.progress();total+=p.stars;const c=document.createElement('button');c.type='button';c.className='gcard';
    c.innerHTML=`<span class="gi">${G.icon}</span><b></b><small></small><span class="prog"><span>المستوى ${p.level}</span><em>★ ${p.stars}</em></span>`;
    c.querySelector('b').textContent=G.name;c.querySelector('small').textContent=G.desc;c.onclick=()=>openGame(G);cards.appendChild(c)});
  const soon=document.createElement('div');soon.className='gcard soon';soon.innerHTML='<span class="gi"><svg viewBox="0 0 48 48"><path d="M24 12v24M12 24h24" stroke="#8aa39d" stroke-width="4" stroke-linecap="round"/></svg></span><span><b>ألعاب جديدة قريباً</b><br><small>اطلب أي لعبة تريد إضافتها</small></span>';cards.appendChild(soon);
  $('totalStars').textContent=total;
}
function openGame(G){
  if(active&&active.stop)active.stop();active=G;stage.innerHTML='';$('ctrl').innerHTML='';
  $('gTitle').textContent=G.name;$('help').textContent=G.help;$('hub').hidden=true;$('play').hidden=false;scrollTo(0,0);G.start();
  try{localStorage.setItem('arcade-last',G.id)}catch(e){}
}
$('back').onclick=()=>{if(active&&active.stop)active.stop();active=null;stage.innerHTML='';$('play').hidden=true;$('hub').hidden=false;renderHub()};
renderHub();
</script>
