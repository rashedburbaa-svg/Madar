<title>قاعة المدار</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: hub (daily challenge, game cards, badges) -> game screen (top bar, stats, stage, controls). Deliberately dark night-orbit identity. */
:root{
  --bg:#0b1618; --panel:#122326; --tile:#16292d; --tile-hi:#1d373b; --line:#24403f;
  --fg:#e8f1ee; --muted:#8aa39d; --pipe:#3a5853; --lit:#3fbf9b; --glow:rgba(63,191,155,.45);
  --gold:#f2b84b; --danger:#f2a09a; --fire:#ff8a4c;
  --display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:540px;margin:0 auto;padding-block:14px 22px;display:flex;flex-direction:column;gap:14px}
.inner{display:flex;flex-direction:column;gap:14px}

.hubhead{display:flex;align-items:center;gap:8px}
.hubhead h1{font-family:var(--display);font-size:28px;margin:0;flex:1;line-height:1.2}
.hubhead h1 span{color:var(--gold)}
.pill{display:flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill svg{width:17px;height:17px;fill:var(--gold)}
.tog{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;flex:none;font-size:17px}
.tog.off{opacity:.45}
.hubsub{margin:0;color:var(--muted);font-size:14px}
h3.sec{font-family:var(--display);font-size:19px;margin:6px 0 -4px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--panel);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabbar .tb{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.tabbar button{background:none;border:0;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:12.5px;cursor:pointer;position:relative;min-width:0}
.tabbar button span{white-space:nowrap}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-selected="true"]{color:var(--gold)}
.tabbar button[aria-selected="true"]::before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
.tabbar .dot{position:absolute;top:7px;left:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:var(--fire);box-shadow:0 0 0 2px var(--panel)}
#hub{padding-bottom:74px}
.panel{display:flex;flex-direction:column;gap:14px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.week span{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.week i{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:14px}
.week .on i{border-color:var(--fire);background:rgba(255,138,76,.18)}
.week .today{color:var(--fg);font-weight:600}
.week .today i{border-style:dashed;border-color:var(--gold)}
.week .today.on i{border-style:solid;border-color:var(--fire)}
.dlist{display:flex;flex-direction:column;gap:8px}
.drow{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:var(--tile);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer}
.drow:hover{border-color:var(--lit)}
.drow .gi{width:46px;height:46px;flex:none;background:var(--bg)}
.drow .gi svg{width:30px;height:30px}
.drow .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.drow .t b{font-size:16px}
.drow .t small{font-size:13px;color:var(--muted)}
.drow .go{flex:none;font-size:13px;font-weight:600;padding:6px 14px;border-radius:999px;background:var(--lit);color:#062019}
.drow.done{border-color:var(--lit)}
.drow.done .go{background:transparent;color:var(--gold);padding:6px 4px;letter-spacing:1px}
.dsum{font-size:13.5px;color:var(--muted);text-align:center;margin:0}
.achhead{display:flex;align-items:baseline;gap:8px}
.achhead b{font-family:var(--display);font-size:20px;flex:1;font-weight:700}
.achhead span{color:var(--gold);font-weight:600;font-variant-numeric:tabular-nums}
.achbar{height:8px;border-radius:999px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
.achbar i{display:block;height:100%;background:var(--gold);border-radius:999px;transition:width .4s}
.daily{background:linear-gradient(0deg,var(--panel),var(--panel));border:1px solid var(--gold);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.daily .top{display:flex;align-items:center;gap:10px}
.daily .top b{font-size:17px;flex:1}
.streak{color:var(--fire);font-weight:600;font-variant-numeric:tabular-nums}
.dgames{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.dg{background:var(--tile);border:1px solid var(--line);border-radius:12px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-width:0}
.dg svg{width:30px;height:30px}
.dg small{font-size:11px;color:var(--muted);white-space:nowrap}
.dg.done{border-color:var(--lit)}
.dg.done small{color:var(--lit)}

.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gcard{display:flex;flex-direction:column;gap:8px;text-align:right;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;min-width:0}
.gcard:hover{border-color:var(--lit)}
.gi{width:52px;height:52px;border-radius:14px;background:var(--tile);display:grid;place-items:center}
.gi svg{width:34px;height:34px}
.gcard b{font-size:17px}
.gcard small{color:var(--muted);font-size:13px;line-height:1.5}
.prog{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:auto;font-variant-numeric:tabular-nums}
.prog em{font-style:normal;color:var(--gold)}

.badges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.badge{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.badge .em{font-size:24px;line-height:1;filter:grayscale(1);opacity:.35}
.badge small{font-size:11px;color:var(--muted);line-height:1.35}
.badge.got{border-color:var(--gold)}
.badge.got .em{filter:none;opacity:1}
.badge.got small{color:var(--fg)}

.topbar{display:flex;align-items:center;gap:10px}
.topbar h2{font-family:var(--display);font-size:22px;margin:0;flex:1}
.icon{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;flex:none}
.icon svg{width:20px;height:20px}
.tag{font-size:12px;border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:2px 10px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 4px;text-align:center;min-width:0}
.stat b{display:block;font-size:19px;font-variant-numeric:tabular-nums;font-weight:600;line-height:1.35;white-space:nowrap}
.stat small{font-size:11.5px;color:var(--muted)}
.stat.gold b{color:var(--gold)}
.stage{position:relative;width:100%}
.controls{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;min-width:84px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-size:15px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 8px}
.btn svg{width:18px;height:18px;flex:none}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:default}
.btn.on{border-color:var(--gold);color:var(--gold)}
.btn.main{background:var(--lit);color:#062019;border-color:transparent;font-weight:600}
.help{font-size:13.5px;color:var(--muted);line-height:1.7;margin:0;text-align:center;text-wrap:balance}
.overlay{position:absolute;inset:0;background:rgba(8,16,18,.92);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px;z-index:5;min-height:280px}
.overlay h3{font-family:var(--display);font-size:30px;margin:0}
.overlay p{margin:0;color:var(--muted)}
.overlay .btn{flex:none;width:210px}
.overlay.picker{justify-content:flex-start;overflow-y:auto}
.levels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;width:100%}
.lv{height:54px;border-radius:10px;border:1px solid var(--line);background:var(--tile);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-weight:600;font-variant-numeric:tabular-nums}
.lv small{font-size:10px;color:var(--gold);letter-spacing:1px;font-weight:400}
.lv.cur{border-color:var(--lit)}
.stars{display:flex;gap:6px}.stars svg{width:40px;height:40px}
.stars .on{fill:var(--gold)}.stars .off{fill:#2a3f40}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;white-space:nowrap;z-index:20;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.toast.ach{background:var(--gold);color:#2a1c00;font-weight:600}

/* grid game */
.gboard{display:grid;width:100%;aspect-ratio:1/1;gap:3px;direction:ltr;touch-action:manipulation;border-radius:12px}
.gboard.wrapmode{outline:2px dashed var(--gold);outline-offset:4px}
.cell{position:relative;background:var(--tile);border-radius:8px;cursor:pointer;overflow:hidden;border:0;padding:0}
.cell.locked{background:#0f1e21;cursor:not-allowed}
.cell.locked::after{content:"";position:absolute;top:4px;left:4px;width:7px;height:7px;border-radius:2px;background:var(--muted);opacity:.8}
.cell svg{position:absolute;inset:0;width:100%;height:100%;transition:transform .18s ease}
.arm{stroke:var(--pipe);stroke-width:16;stroke-linecap:round;transition:stroke .2s}
.hub{fill:var(--pipe)}.lit .arm{stroke:var(--lit)}.lit .hub{fill:var(--lit)}
.lit svg{filter:drop-shadow(0 0 4px var(--glow))}
.node{fill:var(--tile);stroke:var(--pipe);stroke-width:7}.lit .node{fill:var(--gold);stroke:var(--gold)}
.gstar{fill:var(--gold)}
.hintflash{animation:hint .9s ease 2}
.shake{animation:shake .3s}
@keyframes hint{50%{box-shadow:inset 0 0 0 3px var(--gold)}}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}

/* sudoku */
.sboard{display:grid;grid-template-columns:repeat(9,1fr);width:100%;aspect-ratio:1/1;direction:ltr;border:2px solid var(--muted);border-radius:10px;overflow:hidden;background:var(--line);gap:1px}
.sc{background:var(--tile);border:0;padding:0;display:grid;place-items:center;font-size:clamp(16px,5vw,24px);font-variant-numeric:tabular-nums;cursor:pointer;position:relative;color:var(--lit)}
.sc.g{color:var(--fg);font-weight:600}
.sc.bR{box-shadow:inset -2px 0 0 var(--muted)}.sc.bB{box-shadow:inset 0 -2px 0 var(--muted)}.sc.bR.bB{box-shadow:inset -2px 0 0 var(--muted),inset 0 -2px 0 var(--muted)}
.sc.peer{background:#18302f}.sc.same{background:#23423d}.sc.sel{background:#2d5650}
.sc.bad{color:var(--danger)}
.notes{display:grid;grid-template-columns:repeat(3,1fr);width:100%;height:100%;font-size:clamp(8px,2.2vw,11px);color:var(--muted);line-height:1}
.notes span{display:grid;place-items:center}
.pad{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:5px;direction:ltr;margin-top:10px}
.pad button{height:48px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:20px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;padding:0}
.pad button small{font-size:10px;color:var(--muted);font-weight:400}
.pad button:disabled{opacity:.3}

canvas{display:block;width:100%;border-radius:14px;touch-action:none}
.difflabel{font-size:12.5px;color:var(--muted);margin:6px 2px 4px}

.mboard{display:grid;gap:6px;direction:ltr;margin:0 auto}
.mc{border:0;padding:0;background:none;cursor:pointer;perspective:600px;min-width:0;width:100%;height:100%}
.mc .in{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.mc.up .in,.mc.done .in{transform:rotateY(180deg)}
.mc .f,.mc .b{position:absolute;inset:0;border-radius:12px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.mc .b{background:var(--tile);border:1px solid var(--line)}
.mc .b svg{width:44%;height:44%;opacity:.55}
.mc .f{background:#e9f3ef;transform:rotateY(180deg);font-size:var(--sym,30px)}
.mc.done .f{background:#cdebdf;box-shadow:0 0 0 3px var(--lit)}
@media (prefers-reduced-motion:reduce){.cell svg,.mc .in{transition:none}.hintflash,.shake{animation:none}}
</style>
</head>
<body style="padding-top:env(safe-area-inset-top,0px)">


<div class="wrap" dir="rtl" lang="ar">
  <section id="hub" class="inner">
    <div class="hubhead">
      <h1>قاعة <span>المدار</span></h1>
      <div class="pill" title="مجموع نجومك"><svg viewBox="0 0 100 100"><path d="M50 6c5 28 16 39 44 44-28 5-39 16-44 44-5-28-16-39-44-44 28-5 39-16 44-44z"/></svg><span id="totalStars">0</span></div>
      <button class="tog" id="sndBtn" type="button" aria-label="الأصوات">🔊</button>
      <button class="tog" id="vibBtn" type="button" aria-label="الاهتزاز">📳</button>
    </div>

      <div class="daily" id="daily"></div>
    </div>
    <div class="panel" id="pGames" role="tabpanel" aria-labelledby="tGames">
      <p class="hubsub">ألعاب تفكير بلا نهاية. كل مستوى أصعب من الذي قبله، وتقدّمك محفوظ دائماً.</p>
      <div class="cards" id="cards"></div>

  </section>

  <section id="play" class="inner" hidden>
    <div class="topbar">
      <button class="icon" id="back" type="button" aria-label="رجوع إلى القاعة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
      <h2 id="gTitle">لعبة</h2>
      <span class="tag" id="dailyTag" hidden>تحدي اليوم</span>
      <button class="icon" id="lvlBtn" type="button" aria-label="اختيار المستوى"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg></button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="stage" id="stage"></div>
    <div class="controls" id="ctrl"></div>
    <p class="help" id="help"></p>
  </section>
</div>
<nav class="tabbar" id="tabbar" dir="rtl" lang="ar" role="tablist" aria-label="أقسام القاعة">
  <div class="tb">
    <button type="button" role="tab" id="tDaily" data-tab="pDaily" aria-controls="pDaily">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M12 13.5l.9 1.8 2 .3-1.45 1.4.35 2-1.8-.95-1.8.95.35-2-1.45-1.4 2-.3z" fill="currentColor" stroke="none"/></svg>
      <span>التحديات اليومية</span><i class="dot" id="dailyDot" hidden></i>
    </button>
    <button type="button" role="tab" id="tGames" data-tab="pGames" aria-controls="pGames">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 10.5v4M5 12.5h4"/><circle cx="15.5" cy="11.5" r="1" fill="currentColor"/><circle cx="18" cy="14" r="1" fill="currentColor"/></svg>
      <span>الألعاب</span>
    </button>
    <button type="button" role="tab" id="tBadges" data-tab="pBadges" aria-controls="pBadges">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="6"/><path d="M8.5 13.9L7 22l5-3 5 3-1.5-8.1"/></svg>
      <span>الأوسمة</span>
    </button>
  </div>
</nav>
<div class="toast" id="toast" hidden></div>

<script>
/* ================= shared ================= */
const $=id=>document.getElementById(id);
function load(k,d){try{const v=localStorage.getItem(k);return v==null?JSON.parse(JSON.stringify(d)):Object.assign(JSON.parse(JSON.stringify(d)),JSON.parse(v))}catch(e){return JSON.parse(JSON.stringify(d))}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,R){for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const toastQ=[];let toastBusy=false;
function toast(t,cls){toastQ.push([t,cls]);if(!toastBusy)nextToast()}
function nextToast(){const it=toastQ.shift();const el=$('toast');if(!it){el.hidden=true;toastBusy=false;return}toastBusy=true;el.textContent=it[0];el.className='toast '+(it[1]||'');el.hidden=false;setTimeout(nextToast,it[1]?2600:1700)}
const STAR='M50 6c5 28 16 39 44 44-28 5-39 16-44 44-5-28-16-39-44-44 28-5 39-16 44-44z';
const starSVG=on=>`<svg viewBox="0 0 100 100"><path class="${on?'on':'off'}" d="${STAR}"/></svg>`;
const fmtTime=s=>{s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const IC={
  undo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l-5 5M15 14l-5-5M15 14H8a5 5 0 0 1 0-10h1"/></svg>',
  hint:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"/></svg>',
  reset:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>',
  erase:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H9L4 15l10-10 6 6-7 7M8 11l6 6"/></svg>',
  pen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/></svg>',
  gauge:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18a8 8 0 1 1 16 0M12 18l4-6"/></svg>'
};

/* settings, sound, vibration */
const prefs=load('arcade-prefs',{sound:true,vibe:true});
let AC=null;
function snd(type){
  if(!prefs.sound)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    const seqs={tap:[[620,.04]],rot:[[430,.04]],ok:[[660,.07],[880,.09]],win:[[523,.11],[659,.11],[784,.12],[1047,.25]],err:[[170,.16]],splash:[[260,.1],[150,.2]],hit:[[240,.03]],flip:[[700,.03]],sink:[[880,.07],[660,.07],[990,.18]],ach:[[784,.09],[1175,.09],[1568,.22]]};
    let at=AC.currentTime;(seqs[type]||seqs.tap).forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type==='err'?'square':type==='splash'?'triangle':'sine';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(type==='err'?.08:.16,at+.012);g.gain.exponentialRampToValueAtTime(.0001,at+d);o.connect(g);g.connect(AC.destination);o.start(at);o.stop(at+d+.03);at+=d*.85});
  }catch(e){}
}
function buzz(ms){if(prefs.vibe&&navigator.vibrate)try{navigator.vibrate(ms)}catch(e){}}
function drawPrefs(){$('sndBtn').textContent=prefs.sound?'🔊':'🔇';$('sndBtn').classList.toggle('off',!prefs.sound);$('vibBtn').classList.toggle('off',!prefs.vibe)}
$('sndBtn').onclick=()=>{prefs.sound=!prefs.sound;save('arcade-prefs',prefs);drawPrefs();snd('ok')};
$('vibBtn').onclick=()=>{prefs.vibe=!prefs.vibe;save('arcade-prefs',prefs);drawPrefs();buzz(40)};

/* screen helpers */
const stage=$('stage');let active=null,mode=null;
function setStats(items){$('stats').innerHTML=items.map(([id,label,cls])=>`<div class="stat ${cls||''}"><b id="${id}">-</b><small>${label}</small></div>`).join('')}
function setStat(id,v){const e=$(id);if(e)e.textContent=v}
function btn(label,icon,fn,cls){const b=document.createElement('button');b.type='button';b.className='btn '+(cls||'');b.innerHTML=(icon||'')+'<span></span>';b.lastChild.textContent=label;b.onclick=fn;$('ctrl').appendChild(b);return b}
function clearOverlays(){stage.querySelectorAll('.overlay').forEach(o=>o.remove())}
function winBox({title,text,stars,onNext,label}){
  const o=document.createElement('div');o.className='overlay';
  o.innerHTML=`<h3></h3><div class="stars">${[1,2,3].map(k=>starSVG(k<=stars)).join('')}</div><p></p><button class="btn main" type="button"></button>`;
  o.querySelector('h3').textContent=title;o.querySelector('p').textContent=text;const b=o.querySelector('button');b.textContent=label||'المستوى التالي';
  b.onclick=()=>{o.remove();onNext()};setTimeout(()=>{stage.appendChild(o);b.focus()},350);
}

/* progress */
function gState(id,extra){return load('arcade-'+id,Object.assign({level:1,best:1,stars:{}},extra||{}))}
function gSave(id,st){save('arcade-'+id,st)}
function starTotal(st){return Object.values(st.stars||{}).reduce((a,b)=>a+b,0)}
function allStars(){return GAMES.reduce((a,G)=>a+starTotal(gState(G.id)),0)}

/* daily */
function todayKey(d){d=d||new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()}
function yesterdayKey(){const d=new Date();d.setDate(d.getDate()-1);return todayKey(d)}
const daily=load('arcade-daily',{streak:0,last:0,done:{},count:0});
function dailyDone(id){return (daily.done[todayKey()]||{})[id]}

/* achievements */
const ACH=[
  ['first','🎉','أول فوز'],['three','⭐','أول 3 نجوم'],['s50','🌟','50 نجمة'],['s150','💫','150 نجمة'],
  ['grid10','🔗','الشبكة: المستوى 10'],['grid9','🧩','لوحة 9×9'],['wrap','🌀','أول شبكة ملتفّة'],['sud_clean','🧠','سودوكو بلا أخطاء'],
  ['sud_fast','⚡','سودوكو في أقل من 5 دقائق'],['sud10','🔢','سودوكو: المستوى 10'],['ace','🏆','ضربة واحدة في الجولف'],['under','🐦','تحت البار'],
  ['eagle_eye','🦅','اختلافات بلا أخطاء'],['diff_fast','⏱️','اختلافات في أقل من دقيقة'],['memory','🃏','ذاكرة مثالية'],['allfive','🎮','فوز في كل الألعاب'],
  ['daily1','📅','أول تحدي يومي'],['streak3','🔥','سلسلة 3 أيام'],['streak7','☄️','سلسلة 7 أيام'],['dailyall','👑','كل تحديات اليوم']
];
const ach=load('arcade-ach',{got:{},won:{}});
function unlock(id){if(ach.got[id])return;ach.got[id]=Date.now();save('arcade-ach',ach);const a=ACH.find(x=>x[0]===id);if(a){snd('ach');buzz([30,40,30]);toast('🏅 وسام جديد: '+a[2],'ach')}}
function onWin(id,level,stars,info){
  info=info||{};snd('win');buzz([20,30,60]);
  ach.won[id]=true;save('arcade-ach',ach);
  unlock('first');if(stars===3)unlock('three');
  const tot=allStars();if(tot>=50)unlock('s50');if(tot>=150)unlock('s150');
  if(GAMES.every(G=>ach.won[G.id]))unlock('allfive');
  if(id==='grid'){if(level>=10)unlock('grid10');if(info.n===9)unlock('grid9');if(info.wrap)unlock('wrap')}
  if(id==='sudoku'){if(info.clean)unlock('sud_clean');if(info.time<300)unlock('sud_fast');if(level>=10)unlock('sud10')}
  if(id==='golf'){if(info.strokes===1)unlock('ace');if(info.strokes<info.par)unlock('under')}
  if(id==='diff'){if(info.mistakes===0&&info.hints===0)unlock('eagle_eye');if(info.time<60)unlock('diff_fast')}
  if(id==='memory'&&info.perfect)unlock('memory');
  if(mode&&mode.daily){const k=todayKey();const first=!daily.done[k]||!Object.keys(daily.done[k]).length;
    daily.done[k]=daily.done[k]||{};daily.done[k][id]=Math.max(daily.done[k][id]||0,stars);
    if(first){daily.streak=daily.last===yesterdayKey()?daily.streak+1:daily.last===k?daily.streak:1;daily.last=k;daily.count++}
    Object.keys(daily.done).forEach(d=>{if(+d<k-100)delete daily.done[d]});save('arcade-daily',daily);
    unlock('daily1');if(daily.streak>=3)unlock('streak3');if(daily.streak>=7)unlock('streak7');
    if(GAMES.every(G=>daily.done[k][G.id]))unlock('dailyall')}
}
/* record + next */
function finishLevel(G,st,level,stars,info,title,text){
  if(mode&&mode.daily){onWin(G.id,level,stars,info);winBox({title,text,stars,label:'رجوع إلى القاعة',onNext:goHub});return}
  st.stars[level]=Math.max(st.stars[level]||0,stars);st.level=Math.max(st.level,level+1);st.best=Math.max(st.best,level+1);gSave(G.id,st);
  onWin(G.id,level,stars,info);
  winBox({title,text,stars,onNext:()=>G.play(level+1)});
}
/* level picker */
function openPicker(){
  if(!active||(mode&&mode.daily))return;const st=gState(active.id);clearOverlays();
  const o=document.createElement('div');o.className='overlay picker';
  o.innerHTML='<h3 style="font-size:24px">اختر المستوى</h3><p>أعد أي مستوى لتحسّن نجومك</p><div class="levels"></div><button class="btn" type="button">إغلاق</button>';
  const box=o.querySelector('.levels');
  for(let l=st.best;l>=1;l--){const b=document.createElement('button');b.type='button';b.className='lv'+(l===st.level?' cur':'');const s=st.stars[l]||0;
    b.innerHTML=`${l}<small>${s?'★'.repeat(s)+'☆'.repeat(3-s):l===st.best?'جديد':'☆☆☆'}</small>`;b.onclick=()=>{o.remove();active.play(l)};box.appendChild(b)}
  o.querySelector('.btn').onclick=()=>o.remove();stage.appendChild(o);o.scrollTop=0;
}
$('lvlBtn').onclick=openPicker;

/* ================= game 1: orbit grid ================= */
const GridGame=(()=>{
  const N=1,E=2,S=4,W=8,DIRS=[[N,0,-1,S],[E,1,0,W],[S,0,1,N],[W,-1,0,E]];
  const rot=m=>((m<<1)|(m>>3))&15,rotK=(m,k)=>{for(let i=0;i<k;i++)m=rot(m);return m};
  let st,g,board,ub,hb;
  const sizeFor=l=>Math.min(4+Math.floor((l-1)/3),9);
  function nb(x,y,dx,dy,n,wrap){let nx=x+dx,ny=y+dy;if(wrap){nx=(nx+n)%n;ny=(ny+n)%n}else if(nx<0||ny<0||nx>=n||ny>=n)return -1;return ny*n+nx}
  function build(level,seed){
    const n=sizeFor(level),R=rng(seed??level*7919+13),wrap=level>=10&&level%2===0,sol=new Array(n*n).fill(0),seen=new Array(n*n).fill(false);
    const src=Math.floor(n/2)*n+Math.floor(n/2),front=[src];seen[src]=true;
    while(front.length){const idx=R()<(level<6?0.75:0.5)?front.length-1:Math.floor(R()*front.length);const c=front[idx],x=c%n,y=(c/n)|0;
      const opts=DIRS.filter(([,dx,dy])=>{const k=nb(x,y,dx,dy,n,wrap);return k>=0&&!seen[k]});
      if(!opts.length){front.splice(idx,1);continue}
      const [b,dx,dy,ob]=opts[Math.floor(R()*opts.length)],nc=nb(x,y,dx,dy,n,wrap);sol[c]|=b;sol[nc]|=ob;seen[nc]=true;front.push(nc)}
    const r=sol.map(()=>Math.floor(R()*4)),locked=new Array(n*n).fill(false);
    if(level>=7){const k=Math.min(Math.floor(n*n*0.08),7);const cand=shuffle([...Array(n*n).keys()].filter(i=>i!==src),R).slice(0,k);cand.forEach(i=>{locked[i]=true;r[i]=0})}
    if(r.every((k,i)=>rotK(sol[i],k)===sol[i])){const i=[...Array(n*n).keys()].find(i=>!locked[i]&&i!==src&&rotK(sol[i],1)!==sol[i]);if(i!=null)r[i]=1}
    return {n,sol,rot:r,src,locked,wrap,moves:0,hist:[],angle:r.map(k=>k*90),level};
  }
  const cur=i=>rotK(g.sol[i],g.rot[i]);
  function minRot(i){const c=cur(i);for(let k=0;k<4;k++)if(rotK(c,k)===g.sol[i])return k;return 0}
  function lit(){const n=g.n,L=new Set([g.src]),q=[g.src];while(q.length){const c=q.shift(),x=c%n,y=(c/n)|0,m=cur(c);
    for(const [b,dx,dy,ob] of DIRS){if(!(m&b))continue;const nc=nb(x,y,dx,dy,n,g.wrap);if(nc<0)continue;if(!L.has(nc)&&(cur(nc)&ob)){L.add(nc);q.push(nc)}}}return L}
  function svg(mask,isSrc){
    const P={[N]:[50,0],[E]:[100,50],[S]:[50,100],[W]:[0,50]};
    const arms=[N,E,S,W].filter(b=>mask&b).map(b=>`<line class="arm" x1="50" y1="50" x2="${P[b][0]}" y2="${P[b][1]}"/>`).join('');
    const leaf=[N,E,S,W].filter(b=>mask&b).length===1;
    return `<svg viewBox="0 0 100 100" aria-hidden="true">${arms}${isSrc?'<path class="gstar" d="M50 22c3 17 11 25 28 28-17 3-25 11-28 28-3-17-11-25-28-28 17-3 25-11 28-28z"/>':leaf?'<circle class="node" cx="50" cy="50" r="17"/>':'<circle class="hub" cx="50" cy="50" r="9"/>'}</svg>`;
  }
  function refresh(){const L=lit();[...board.children].forEach((c,i)=>c.classList.toggle('lit',L.has(i)));
    setStat('s1',mode&&mode.daily?'اليوم':g.level);setStat('s2',g.moves);setStat('s3',g.par);setStat('s4',st.hints);
    ub.disabled=!g.hist.length;hb.disabled=!st.hints;return L.size===g.sol.length}
  function turn(i,rec=true){
    if(g.locked[i]){const el=board.children[i];el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');snd('err');buzz(30);return}
    g.rot[i]=(g.rot[i]+1)%4;g.angle[i]+=90;board.children[i].firstChild.style.transform=`rotate(${g.angle[i]}deg)`;if(rec){g.moves++;g.hist.push(i)}snd('rot');buzz(8);
    if(refresh()){g.over=true;done()}}
  function done(){const m=g.moves,p=g.par,s=m<=p?3:m<=Math.ceil(p*1.5)?2:1;const earned=!(mode&&mode.daily)&&g.level%3===0;if(earned){st.hints++;gSave('grid',st)}
    finishLevel(GridGame,st,g.level,s,{n:g.n,wrap:g.wrap},s===3?'مثالي!':'اكتمل المدار!',`${m} حركة (الحد الأدنى ${p})`+(earned?' · كسبت تلميحاً':'')+(!(mode&&mode.daily)&&sizeFor(g.level+1)>g.n?' · اللوحة تكبر':''))}
  function play(level){
    clearOverlays();st=gState('grid',{hints:3});
    g=mode&&mode.daily?build(13,mode.seed):build(level);g.par=g.sol.reduce((a,_,i)=>a+minRot(i),0);
    board.className='gboard'+(g.wrap?' wrapmode':'');board.style.gridTemplateColumns=`repeat(${g.n},1fr)`;board.innerHTML='';
    g.sol.forEach((m,i)=>{const c=document.createElement('button');c.type='button';c.className='cell'+(g.locked[i]?' locked':'');c.dataset.i=i;c.setAttribute('aria-label',g.locked[i]?'قطعة مقفلة':'قطعة');c.innerHTML=svg(m,i===g.src);c.firstChild.style.transform=`rotate(${g.angle[i]}deg)`;board.appendChild(c)});
    refresh();if(g.wrap&&!(mode&&mode.daily)&&!st.wrapSeen){st.wrapSeen=1;gSave('grid',st);toast('شبكة ملتفّة: الأطراف متصلة بالجهة المقابلة')}
  }
  return {id:'grid',name:'شبكة المدار',desc:'دوّر القطع حتى تضيء الشبكة كلها',play,
    icon:'<svg viewBox="0 0 48 48"><g stroke="#3fbf9b" stroke-width="5" stroke-linecap="round" fill="none"><path d="M24 24V8M24 24h16M24 24v16M24 24H10"/></g><path fill="#f2b84b" d="M24 14c1.6 6.5 3.5 8.4 10 10-6.5 1.6-8.4 3.5-10 10-1.6-6.5-3.5-8.4-10-10 6.5-1.6 8.4-3.5 10-10z"/></svg>',
    help:'اضغط أي قطعة لتدويرها، ووصّل كل الأنابيب بالنجمة حتى تضيء كل النقاط. القطع الداكنة مقفلة وفي مكانها الصحيح. اللوحة ذات الإطار الذهبي المتقطع «ملتفّة»: ما يخرج من طرف يدخل من الطرف المقابل.',
    progress(){const s=gState('grid',{hints:3});return {level:s.level,stars:starTotal(s)}},
    start(){st=gState('grid',{hints:3});setStats([['s1','المستوى'],['s2','حركاتك'],['s3','الحد الأدنى','gold'],['s4','تلميحات']]);
      board=document.createElement('div');board.className='gboard';stage.appendChild(board);
      board.onclick=e=>{const c=e.target.closest('.cell');if(c&&!g.over)turn(+c.dataset.i)};
      ub=btn('تراجع',IC.undo,()=>{if(!g.hist.length||g.over)return;const i=g.hist.pop();g.rot[i]=(g.rot[i]+3)%4;g.angle[i]-=90;g.moves--;board.children[i].firstChild.style.transform=`rotate(${g.angle[i]}deg)`;snd('tap');refresh()});
      hb=btn('تلميح',IC.hint,()=>{if(!st.hints||g.over)return;const L=lit(),n=g.n,wrong=g.sol.map((_,i)=>i).filter(i=>!g.locked[i]&&minRot(i)>0);if(!wrong.length)return;
        const near=wrong.filter(i=>DIRS.some(([,dx,dy])=>{const k=nb(i%n,(i/n)|0,dx,dy,n,g.wrap);return k>=0&&L.has(k)}));
        const i=(near.length?near:wrong)[0];st.hints--;gSave('grid',st);const el=board.children[i];el.classList.remove('hintflash');void el.offsetWidth;el.classList.add('hintflash');
        const k=minRot(i);for(let j=0;j<k&&!g.over;j++)turn(i)});
      btn('إعادة',IC.reset,()=>play(g.level));play(st.level)},
    stop(){}};
})();

/* ================= game 2: sudoku ================= */
const SudokuGame=(()=>{
  const DIFFS={auto:['تلقائي',null],easy:['سهل',42],medium:['متوسط',34],hard:['صعب',28],expert:['خبير',24]},ORDER=['auto','easy','medium','hard','expert'];
  let st,p,boardEl,padEl,sel=-1,notesMode=false,nb2,db,timer=0;
  const peers=i=>{const r=(i/9)|0,c=i%9,br=r-r%3,bc=c-c%3,o=[];for(let k=0;k<9;k++){o.push(r*9+k,k*9+c,(br+((k/3)|0))*9+bc+k%3)}return o};
  function solve(b,limit,R){
    const rows=new Array(9).fill(0),cols=new Array(9).fill(0),box=new Array(9).fill(0);let count=0;
    for(let i=0;i<81;i++)if(b[i]){const r=(i/9)|0,c=i%9,m=1<<b[i];rows[r]|=m;cols[c]|=m;box[(r/3|0)*3+(c/3|0)]|=m}
    (function rec(){let best=-1,bm=0,bn=10;
      for(let i=0;i<81;i++)if(!b[i]){const r=(i/9)|0,c=i%9,m=~(rows[r]|cols[c]|box[(r/3|0)*3+(c/3|0)])&0x3FE;let n=0;for(let d=1;d<10;d++)if(m&(1<<d))n++;if(n<bn){bn=n;best=i;bm=m;if(!n)return}}
      if(best<0){count++;return}
      const r=(best/9)|0,c=best%9,bx=(r/3|0)*3+(c/3|0);let ds=[1,2,3,4,5,6,7,8,9];if(R)ds=shuffle(ds,R);
      for(const d of ds){if(!(bm&(1<<d)))continue;const m=1<<d;b[best]=d;rows[r]|=m;cols[c]|=m;box[bx]|=m;rec();if(count>=limit)return;b[best]=0;rows[r]&=~m;cols[c]&=~m;box[bx]&=~m}
    })();return count}
  function generate(level,diff,seed){
    const R=rng(seed??(level*1013+ORDER.indexOf(diff)*7+77)),full=new Array(81).fill(0);solve(full,1,R);
    const target=DIFFS[diff][1]??Math.max(24,44-level),puz=full.slice(),order=shuffle([...Array(81).keys()],R);let clues=81;
    for(const i of order){if(clues<=target)break;const k=puz[i];puz[i]=0;if(solve(puz.slice(),2)!==1)puz[i]=k;else clues--}
    return {level,diff,sol:full,giv:puz,cur:puz.slice(),notes:new Array(81).fill(0),mistakes:0,hints:0,time:0,daily:mode&&mode.daily?mode.key:0};
  }
  function persist(){if(mode&&mode.daily){st.dailyCur=p}else st.cur=p;gSave('sudoku',st)}
  function render(){
    const cells=boardEl.children,sv=sel>=0?p.cur[sel]:0,pr=sel>=0?new Set(peers(sel)):new Set();
    for(let i=0;i<81;i++){const c=cells[i],v=p.cur[i];
      c.className='sc'+(p.giv[i]?' g':'')+((i%9===2||i%9===5)?' bR':'')+((((i/9)|0)===2||((i/9)|0)===5)?' bB':'')+(pr.has(i)?' peer':'')+(sv&&v===sv?' same':'')+(i===sel?' sel':'')+(v&&v!==p.sol[i]?' bad':'');
      if(v)c.textContent=v;else if(p.notes[i]){c.innerHTML='<div class="notes">'+[1,2,3,4,5,6,7,8,9].map(d=>`<span>${p.notes[i]&(1<<d)?d:''}</span>`).join('')+'</div>'}else c.textContent=''}
    const cnt=new Array(10).fill(0);p.cur.forEach((v,i)=>{if(v&&v===p.sol[i])cnt[v]++});
    [...padEl.children].forEach((b,k)=>{const left=9-cnt[k+1];b.disabled=left<=0;b.lastChild.textContent=left>0?left:''});
    setStat('s1',mode&&mode.daily?'اليوم':p.level);setStat('s2',fmtTime(p.time));setStat('s3',p.mistakes);setStat('s4',st.hints);
    nb2.classList.toggle('on',notesMode);db.lastChild.textContent='الصعوبة: '+DIFFS[st.diff][0];db.disabled=!!(mode&&mode.daily);
  }
  function put(d){
    if(sel<0||p.giv[sel]||p.over)return;
    if(notesMode&&d){if(p.cur[sel])return;p.notes[sel]^=(1<<d);snd('tap');render();persist();return}
    if(!d){p.cur[sel]=0;p.notes[sel]=0;snd('tap');render();persist();return}
    p.cur[sel]=d;p.notes[sel]=0;
    if(d!==p.sol[sel]){p.mistakes++;snd('err');buzz(60);toast('رقم غير صحيح')}else{snd('ok');buzz(8);peers(sel).forEach(j=>{p.notes[j]&=~(1<<d)})}
    render();persist();
    if(p.cur.every((v,i)=>v===p.sol[i]))finish();
  }
  function finish(){p.over=true;clearInterval(timer);const s=p.mistakes===0&&p.hints===0?3:p.mistakes+p.hints<=2?2:1;const daily=mode&&mode.daily;
    const earned=!daily&&p.level%2===0;if(earned)st.hints++;
    const key=daily?'daily':st.diff;const prevBest=st.bestTime[key];const rec=!prevBest||p.time<prevBest;if(rec)st.bestTime[key]=Math.floor(p.time);
    if(daily)st.dailyCur=null;else st.cur=null;gSave('sudoku',st);
    finishLevel(SudokuGame,st,p.level,s,{clean:p.mistakes===0&&p.hints===0,time:p.time},rec?'رقم قياسي!':'أحسنت!',`الوقت ${fmtTime(p.time)}`+(prevBest&&!rec?` · الأفضل ${fmtTime(prevBest)}`:'')+` · أخطاء ${p.mistakes}`+(earned?' · كسبت تلميحاً':''))}
  function play(level,fresh){
    clearOverlays();clearInterval(timer);st=gState('sudoku',{hints:3,cur:null,dailyCur:null,diff:'auto',bestTime:{}});
    if(mode&&mode.daily){p=st.dailyCur&&st.dailyCur.daily===mode.key&&!st.dailyCur.over?st.dailyCur:generate(16,'medium',mode.seed);p.level=16}
    else if(!fresh&&st.cur&&st.cur.level===level&&st.cur.diff===st.diff&&!st.cur.over)p=st.cur;
    else p=generate(level,st.diff);
    persist();sel=p.cur.findIndex(v=>!v);notesMode=false;render();
    timer=setInterval(()=>{if(document.hidden||p.over)return;p.time+=1;setStat('s2',fmtTime(p.time));if(Math.floor(p.time)%5===0)persist()},1000);
  }
  return {id:'sudoku',name:'سودوكو',desc:'املأ الأرقام 1-9 بدون تكرار',play,
    icon:'<svg viewBox="0 0 48 48"><rect x="6" y="6" width="36" height="36" rx="5" fill="none" stroke="#3a5853" stroke-width="2.5"/><path d="M18 6v36M30 6v36M6 18h36M6 30h36" stroke="#3a5853" stroke-width="2"/><text x="12" y="16" font-size="9" fill="#e8f1ee" font-family="sans-serif" text-anchor="middle">5</text><text x="24" y="28" font-size="9" fill="#3fbf9b" font-family="sans-serif" text-anchor="middle">3</text><text x="36" y="40" font-size="9" fill="#f2b84b" font-family="sans-serif" text-anchor="middle">9</text></svg>',
    help:'كل صف وعمود ومربع 3×3 يحتوي الأرقام 1-9 مرة واحدة. اضغط خانة ثم رقماً. «ملاحظات» لكتابة الاحتمالات. «الصعوبة» تختار بين التلقائي (يصعب مع المستويات) أو مستوى ثابت.',
    progress(){const s=gState('sudoku',{hints:3});return {level:s.level,stars:starTotal(s)}},
    start(){st=gState('sudoku',{hints:3,cur:null,dailyCur:null,diff:'auto',bestTime:{}});setStats([['s1','المستوى'],['s2','الوقت','gold'],['s3','أخطاء'],['s4','تلميحات']]);
      boardEl=document.createElement('div');boardEl.className='sboard';for(let i=0;i<81;i++){const c=document.createElement('button');c.type='button';c.dataset.i=i;boardEl.appendChild(c)}
      boardEl.onclick=e=>{const c=e.target.closest('button');if(!c)return;sel=+c.dataset.i;snd('tap');render()};
      padEl=document.createElement('div');padEl.className='pad';
      for(let d=1;d<=9;d++){const b=document.createElement('button');b.type='button';b.innerHTML=d+'<small></small>';b.onclick=()=>put(d);padEl.appendChild(b)}
      stage.append(boardEl,padEl);
      btn('مسح',IC.erase,()=>put(0));nb2=btn('ملاحظات',IC.pen,()=>{notesMode=!notesMode;render()});
      btn('تلميح',IC.hint,()=>{if(!st.hints||p.over)return;let i=sel>=0&&p.cur[sel]!==p.sol[sel]?sel:p.cur.findIndex((v,j)=>v!==p.sol[j]);if(i<0)return;
        st.hints--;p.hints++;sel=i;const m=notesMode;notesMode=false;p.cur[i]=0;put(p.sol[i]);notesMode=m;gSave('sudoku',st);render()});
      db=btn('الصعوبة',IC.gauge,()=>{if(mode&&mode.daily)return;st.diff=ORDER[(ORDER.indexOf(st.diff)+1)%ORDER.length];st.cur=null;gSave('sudoku',st);toast('الصعوبة: '+DIFFS[st.diff][0]);play(p.level,true)});
      db.style.flexBasis='100%';
      document.addEventListener('keydown',this.key=e=>{if(/^[1-9]$/.test(e.key))put(+e.key);if(e.key==='Backspace'||e.key==='Delete')put(0)});
      setTimeout(()=>play(st.level),20)},
    stop(){clearInterval(timer);if(p&&!p.over)persist();document.removeEventListener('keydown',this.key)}};
})();

/* ================= game 3: mini golf ================= */
const GolfGame=(()=>{

      case 'sun':circ(0,0,15,C);ctx.strokeStyle=C;ctx.lineWidth=3;for(let k=0;k<8;k++){const a=k*Math.PI/4;ctx.beginPath();ctx.moveTo(Math.cos(a)*19,Math.sin(a)*19);ctx.lineTo(Math.cos(a)*26,Math.sin(a)*26);ctx.stroke()}break;
      case 'cloud':{const f=`hsl(${o.c.h} 25% ${92-(o.c.l-48)/3}%)`;circ(-12,4,11,f);circ(2,-3,14,f);circ(16,4,10,f);rect(-12,4,28,10,f);break}
      case 'bird':ctx.strokeStyle=dark;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(-11,-2);ctx.quadraticCurveTo(-5,-8,0,0);ctx.quadraticCurveTo(6,-9,12,-3);ctx.stroke();circ(9,0,2,C);break;
      case 'butterfly':circ(-6,-3,6,C);circ(6,-3,6,C);circ(-5,5,4,C);circ(5,5,4,C);if(o.v){circ(-6,-3,2,'#fff');circ(6,-3,2,'#fff')}rect(-1,-7,2,14,dark);break;
      case 'tree':rect(-4,0,8,26,'#7a5232');circ(0,-6,18,C);circ(-12,2,11,C);circ(12,2,11,C);break;
      case 'flower':ctx.strokeStyle='#3f8a3a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,16);ctx.stroke();for(let k=0;k<5;k++){const a=k*Math.PI*2/5;circ(Math.cos(a)*6,Math.sin(a)*6-2,5,C)}circ(0,-2,3.5,'#f4d03f');break;
      case 'bush':{const f=`hsl(${110+(o.c.h%40)} 45% ${o.c.l-12}%)`;circ(-9,4,9,f);circ(0,-3,11,f);circ(10,4,9,f);break}
      case 'mushroom':rect(-3,0,6,11,'#f1e6cf');ctx.fillStyle=C;ctx.beginPath();ctx.arc(0,1,12,Math.PI,0);ctx.fill();if(o.v){circ(-5,-4,2,'#fff');circ(3,-7,2,'#fff');circ(6,-2,1.6,'#fff')}break;
      case 'house':rect(-24,-12,48,34,C);ctx.fillStyle='#7b3b31';ctx.beginPath();ctx.moveTo(-28,-12);ctx.lineTo(0,-34);ctx.lineTo(28,-12);ctx.fill();
        rect(-6,4,12,18,'#5a3a26');const wf=o.v?'#ffe27a':'#3c4a57';rect(-18,-6,9,9,wf);rect(9,-6,9,9,wf);break;
      case 'car':ctx.fillStyle=C;if(ctx.roundRect){ctx.beginPath();ctx.roundRect(-22,-6,44,14,4);ctx.fill();ctx.beginPath();ctx.roundRect(-12,-16,22,12,4);ctx.fill()}else{rect(-22,-6,44,14,C);rect(-12,-16,22,12,C)}
        rect(-8,-13,7,7,'#cfe9f7');rect(1,-13,7,7,'#cfe9f7');circ(-12,9,5,'#222');circ(12,9,5,'#222');rect(18,-3,4,3,'#ffe27a');break;
      case 'lamp':rect(-1.5,-18,3,38,'#444');rect(-8,-22,16,5,'#444');circ(0,-15,4,o.v?'#ffe27a':'#888');if(o.v){ctx.fillStyle='rgba(255,226,122,.25)';ctx.beginPath();ctx.arc(0,-15,10,0,7);ctx.fill()}break;
      case 'sign':rect(-1.5,-6,3,22,'#666');ctx.fillStyle=C;ctx.beginPath();ctx.moveTo(-12,-16);ctx.lineTo(8,-16);ctx.lineTo(14,-10);ctx.lineTo(8,-4);ctx.lineTo(-12,-4);ctx.fill();break;
      case 'frame':rect(-20,-15,40,30,'#8a5a32');rect(-16,-11,32,22,C);ctx.fillStyle='rgba(255,255,255,.6)';ctx.beginPath();ctx.moveTo(-16,11);ctx.lineTo(-4,-3);ctx.lineTo(4,5);ctx.lineTo(9,0);ctx.lineTo(16,11);ctx.fill();break;
      case 'clock':circ(0,0,15,'#fff');ctx.strokeStyle=C;ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,15,0,7);ctx.stroke();ctx.strokeStyle=dark;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-10);ctx.moveTo(0,0);ctx.lineTo(o.v?8:-8,o.v?2:4);ctx.stroke();break;
      case 'shelfbook':rect(-20,10,40,4,'#8a5a32');[-15,-8,-1,6,12].forEach((x,k)=>rect(x,-8+(k%2)*3,6,18-(k%2)*3,`hsl(${(o.c.h+k*47)%360} 55% 50%)`));break;
      case 'window':rect(-22,-18,44,36,'#fff');rect(-19,-15,38,30,o.v?'#9fd4f2':'#30425a');rect(-1,-15,2,30,'#fff');rect(-19,-1,38,2,'#fff');if(!o.v)circ(10,-7,4,'#f2e6a8');break;
      case 'plant':ctx.fillStyle=C;ctx.beginPath();ctx.moveTo(-10,2);ctx.lineTo(10,2);ctx.lineTo(7,18);ctx.lineTo(-7,18);ctx.fill();ctx.fillStyle='#3f8a3a';[-0.6,0,0.6].forEach(a=>{ctx.save();ctx.rotate(a);ctx.beginPath();ctx.ellipse(0,-10,5,12,0,0,7);ctx.fill();ctx.restore()});break;
      case 'lampr':rect(-2,-6,4,22,'#555');rect(-9,15,18,4,'#555');ctx.fillStyle=C;ctx.beginPath();ctx.moveTo(-8,-20);ctx.lineTo(8,-20);ctx.lineTo(13,-6);ctx.lineTo(-13,-6);ctx.fill();if(o.v){ctx.fillStyle='rgba(255,226,122,.35)';ctx.beginPath();ctx.moveTo(-13,-6);ctx.lineTo(13,-6);ctx.lineTo(20,14);ctx.lineTo(-20,14);ctx.fill()}break;
      case 'chair':rect(-12,0,24,5,C);rect(8,-20,4,22,C);rect(-11,5,3,15,dark);rect(8,5,3,15,dark);break;
      case 'cup':rect(-7,-6,14,14,C);ctx.strokeStyle=C;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(9,1,4,-1.4,1.4);ctx.stroke();rect(-9,8,18,2,'#ddd');break;
      case 'books':[0,1,2].forEach(k=>rect(-14+k*2,8-k*7,28-k*4,7,`hsl(${(o.c.h+k*70)%360} 55% 50%)`));break;
      case 'ball':circ(0,0,11,C);ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,11,-0.5,1.2);ctx.stroke();break;
    }
    ctx.restore();
  }
  function paint(ctx,list){
    bg(ctx);list.forEach(o=>obj(ctx,o));
    g.diffs.forEach(d=>{if(!d.found&&!d.hint)return;ctx.strokeStyle=d.found?'#0f7a62':'#f2b84b';ctx.lineWidth=4;ctx.setLineDash(d.found?[]:[6,5]);ctx.beginPath();ctx.arc(d.x,d.y,d.r+9,0,7);ctx.stroke();ctx.setLineDash([])});
    if(wrongMark){ctx.strokeStyle='#d64545';ctx.lineWidth=5;const {x,y}=wrongMark;ctx.beginPath();ctx.moveTo(x-10,y-10);ctx.lineTo(x+10,y+10);ctx.moveTo(x+10,y-10);ctx.lineTo(x-10,y+10);ctx.stroke()}
  }
  function draw(){paint(xA,g.A);paint(xB,g.B)}
  function size(c,x){const w=stage.clientWidth;c.width=Math.round(w*devicePixelRatio);c.height=Math.round(w*H/W*devicePixelRatio);c.style.height=(w*H/W)+'px';x.setTransform(w/W*devicePixelRatio,0,0,w/W*devicePixelRatio,0,0)}
  function upd(){setStat('s1',mode&&mode.daily?'اليوم':g.level);setStat('s2',g.diffs.filter(d=>d.found).length+'/'+g.diffs.length);setStat('s3',g.mistakes);setStat('s4',fmtTime(g.time))}
  function tap(e,c){if(g.over)return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
    const d=g.diffs.filter(d=>!d.found).sort((a,b)=>Math.hypot(a.x-x,a.y-y)-Math.hypot(b.x-x,b.y-y))[0];
    if(d&&Math.hypot(d.x-x,d.y-y)<d.r+16){d.found=true;d.hint=false;snd('ok');buzz(20)}
    else{g.mistakes++;snd('err');buzz(60);wrongMark={x,y};setTimeout(()=>{wrongMark=null;draw()},500)}
    draw();upd();
    if(g.diffs.every(d=>d.found)){g.over=true;clearInterval(timer);const s=g.mistakes===0&&g.hints===0?3:g.mistakes+g.hints<=2?2:1;const earned=!(mode&&mode.daily)&&g.level%3===0;if(earned){st.hints++;gSave('diff',st)}
      const key=mode&&mode.daily?'daily':'l'+g.level;const prev=st.bestTime[key];if(!prev||g.time<prev){st.bestTime[key]=g.time;gSave('diff',st)}
      finishLevel(DiffGame,st,g.level,s,{mistakes:g.mistakes,hints:g.hints,time:g.time},'وجدتها كلها!',`الوقت ${fmtTime(g.time)} · أخطاء ${g.mistakes}`+(earned?' · كسبت تلميحاً':''))}}
  function play(level){clearOverlays();clearInterval(timer);st=gState('diff',{hints:3,bestTime:{}});g=mode&&mode.daily?build(9,mode.seed):build(level);draw();upd();
    timer=setInterval(()=>{if(document.hidden||g.over)return;g.time++;setStat('s4',fmtTime(g.time))},1000)}
  return {id:'diff',name:'أوجد الاختلاف',desc:'حديقة وشارع وغرفة: اكتشف الفروق',play,
    icon:'<svg viewBox="0 0 48 48"><rect x="4" y="8" width="18" height="32" rx="4" fill="#bfe3f5"/><rect x="26" y="8" width="18" height="32" rx="4" fill="#bfe3f5"/><rect x="4" y="26" width="18" height="14" rx="3" fill="#7cc46a"/><rect x="26" y="26" width="18" height="14" rx="3" fill="#7cc46a"/><circle cx="13" cy="24" r="5" fill="#3fbf9b"/><circle cx="35" cy="24" r="5" fill="#f2b84b"/></svg>',
    help:'الصورتان متشابهتان إلا في بعض التفاصيل: لون، أو حجم، أو شيء مفقود، أو نافذة مضيئة، أو سيارة بالاتجاه المعاكس. اضغط مكان الاختلاف في أي صورة. الضغط الخاطئ يُحسب خطأ.',
    progress(){const s=gState('diff',{hints:3});return {level:s.level,stars:starTotal(s)}},
    start(){st=gState('diff',{hints:3,bestTime:{}});setStats([['s1','المستوى'],['s2','وجدت','gold'],['s3','أخطاء'],['s4','الوقت']]);
      const la=document.createElement('div');la.className='difflabel';la.textContent='الصورة الأصلية';const lb=document.createElement('div');lb.className='difflabel';lb.textContent='الصورة المعدّلة';
      cA=document.createElement('canvas');cB=document.createElement('canvas');xA=cA.getContext('2d');xB=cB.getContext('2d');stage.append(la,cA,lb,cB);size(cA,xA);size(cB,xB);
      cA.onpointerdown=e=>tap(e,cA);cB.onpointerdown=e=>tap(e,cB);this.rs=()=>{size(cA,xA);size(cB,xB);draw()};addEventListener('resize',this.rs);
      btn('تلميح',IC.hint,()=>{if(!st.hints||g.over)return;const d=g.diffs.find(d=>!d.found&&!d.hint);if(!d)return;d.hint=true;g.hints++;st.hints--;gSave('diff',st);snd('tap');draw();upd();toast('تلميحات متبقية: '+st.hints)});
      btn('إعادة',IC.reset,()=>play(g.level));play(st.level)},
    stop(){clearInterval(timer);removeEventListener('resize',this.rs)}};
})();

/* ================= game 5: memory ================= */
const MemoryGame=(()=>{
  const SYM=['🍎','🍋','🍇','🍉','🥝','🍒','🌙','⭐','🐪','🦅','🐬','🌴','⚓','🎯','🔑','🚀','🌵','🦋'];
  let st,g,boardEl,lock=false;
  function build(level,seed){const R=rng(seed??level*541+3),pairs=Math.min(5+level,18),syms=shuffle(SYM.slice(),R).slice(0,pairs);
    return {level,pairs,cards:shuffle(syms.concat(syms),R).map(s=>({s,done:false})),open:[],moves:0,found:0}}
  function fit(){if(!g||!boardEl)return;const n=g.cards.length,gap=6,ratio=1.25,top=boardEl.getBoundingClientRect().top,availW=stage.clientWidth,availH=Math.max(220,innerHeight-Math.max(top,0)-110);
    let best={w:0,c:4};for(let c=3;c<=8;c++){const r=Math.ceil(n/c),w=Math.min((availW-gap*(c-1))/c,((availH-gap*(r-1))/r)/ratio);if(w>best.w)best={w,c}}
    const w=Math.floor(best.w),h=Math.floor(w*ratio);boardEl.style.gridTemplateColumns=`repeat(${best.c},${w}px)`;boardEl.style.gridAutoRows=h+'px';boardEl.style.width=(best.c*w+gap*(best.c-1))+'px';boardEl.style.setProperty('--sym',Math.round(w*0.5)+'px')}
  const goal=()=>Math.round(g.pairs*1.6);
  function upd(){setStat('s1',mode&&mode.daily?'اليوم':g.level);setStat('s2',g.moves);setStat('s3',g.found+'/'+g.pairs);setStat('s4',goal())}
  function flip(i){if(lock||g.over)return;const c=g.cards[i],el=boardEl.children[i];if(c.done||g.open.includes(i))return;
    el.classList.add('up');g.open.push(i);snd('flip');
    if(g.open.length===2){g.moves++;const [a,b]=g.open;
      if(g.cards[a].s===g.cards[b].s){g.cards[a].done=g.cards[b].done=true;boardEl.children[a].classList.add('done');boardEl.children[b].classList.add('done');g.open=[];g.found++;snd('ok');buzz(15);
        if(g.found===g.pairs){g.over=true;const s=g.moves<=goal()?3:g.moves<=Math.round(g.pairs*2.3)?2:1;
          finishLevel(MemoryGame,st,g.level,s,{perfect:g.moves<=g.pairs+1},'ذاكرة قوية!',`${g.moves} محاولة لـ ${g.pairs} أزواج`)}}
      else{lock=true;setTimeout(()=>{boardEl.children[a].classList.remove('up');boardEl.children[b].classList.remove('up');g.open=[];lock=false},750)}}
    upd()}
  function play(level){clearOverlays();st=gState('memory');g=mode&&mode.daily?build(8,mode.seed):build(level);lock=false;boardEl.innerHTML='';
    g.cards.forEach((c,i)=>{const b=document.createElement('button');b.type='button';b.className='mc';b.setAttribute('aria-label','بطاقة');
      b.innerHTML=`<div class="in"><div class="b"><svg viewBox="0 0 100 100"><ellipse cx="50" cy="50" rx="44" ry="18" fill="none" stroke="#3fbf9b" stroke-width="6" transform="rotate(-30 50 50)"/><path fill="#f2b84b" d="M50 28c2.6 13 9 19.4 22 22-13 2.6-19.4 9-22 22-2.6-13-9-19.4-22-22 13-2.6 19.4-9 22-22z"/></svg></div><div class="f">${c.s}</div></div>`;
      b.onclick=()=>flip(i);boardEl.appendChild(b)});fit();upd();
    const lv=mode&&mode.daily?8:level;if(lv<=4){lock=true;[...boardEl.children].forEach(b=>b.classList.add('up'));setTimeout(()=>{[...boardEl.children].forEach(b=>b.classList.remove('up'));lock=false},1200+lv*250)}}
  return {id:'memory',name:'الذاكرة',desc:'اقلب البطاقات وطابق الأزواج',play,
    icon:'<svg viewBox="0 0 48 48"><rect x="5" y="9" width="17" height="24" rx="3" fill="#16292d" stroke="#3fbf9b" stroke-width="2"/><rect x="26" y="15" width="17" height="24" rx="3" fill="#e9f3ef"/><path fill="#f2b84b" d="M34 20c1 4.5 2.4 5.9 7 7-4.6 1-6 2.4-7 7-1-4.6-2.4-6-7-7 4.6-1.1 6-2.5 7-7z"/></svg>',
    help:'اقلب بطاقتين في كل محاولة، وإذا تطابقتا تبقيان مفتوحتين. في المستويات الأولى ترى البطاقات لحظة في البداية، ثم يزيد عدد الأزواج وتختفي المساعدة.',
    progress(){const s=gState('memory');return {level:s.level,stars:starTotal(s)}},
    start(){st=gState('memory');setStats([['s1','المستوى'],['s2','محاولات'],['s3','أزواج','gold'],['s4','هدف 3 نجوم']]);
      boardEl=document.createElement('div');boardEl.className='mboard';stage.appendChild(boardEl);btn('إعادة',IC.reset,()=>play(g.level));play(st.level);this.rs=()=>fit();addEventListener('resize',this.rs)},
    stop(){removeEventListener('resize',this.rs)}};
})();

/* ================= hub ================= */
const GAMES=[GridGame,SudokuGame,GolfGame,DiffGame,MemoryGame];
function renderHub(){
  drawPrefs();
  const k=todayKey(),doneToday=daily.done[k]||{},alive=daily.last===k||daily.last===yesterdayKey(),streak=alive?daily.streak:0;
  const d=$('daily');
  const DAYS=['أحد','إثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];let week='';
  for(let back=6;back>=0;back--){const dt=new Date();dt.setDate(dt.getDate()-back);const kk=todayKey(dt),on=daily.done[kk]&&Object.keys(daily.done[kk]).length;
    week+=`<span class="${on?'on ':''}${back===0?'today':''}"><i>${on?'🔥':''}</i>${back===0?'اليوم':DAYS[dt.getDay()]}</span>`}
  const nDone=GAMES.filter(G=>doneToday[G.id]).length;
  d.innerHTML=`<div class="top"><b>تحدي اليوم</b><span class="streak">🔥 ${streak} ${streak===1?'يوم':'أيام'}</span></div><small style="color:var(--muted)">لغز جديد كل يوم في كل لعبة. حلّ واحداً على الأقل يومياً لتحافظ على السلسلة.</small><div class="week">${week}</div>`;
  let list=document.getElementById('dlist');if(!list){list=document.createElement('div');list.id='dlist';list.className='dlist';d.after(list)}list.innerHTML='';
  GAMES.forEach((G,i)=>{const s=doneToday[G.id];const b=document.createElement('button');b.type='button';b.className='drow'+(s?' done':'');
    b.innerHTML=`<span class="gi">${G.icon}</span><span class="t"><b></b><small></small></span><span class="go">${s?'★'.repeat(s)+'☆'.repeat(3-s):'العب'}</span>`;
    b.querySelector('b').textContent=G.name;b.querySelector('small').textContent=s?(s<3?'أُنجز · أعد اللعب لتحصل على 3 نجوم':'أُنجز بإتقان'):'لم يُحل بعد';
    b.setAttribute('aria-label','تحدي اليوم: '+G.name);b.onclick=()=>openGame(G,{daily:true,key:k,seed:k*97+i*7});list.appendChild(b)});
  let sum=document.getElementById('dsum');if(!sum){sum=document.createElement('p');sum.id='dsum';sum.className='dsum';list.after(sum)}
  sum.textContent=nDone===GAMES.length?'👑 أنهيت كل تحديات اليوم! عُد غداً لتحديات جديدة.':`أنجزت ${nDone} من ${GAMES.length} تحديات اليوم`;
  $('dailyDot').hidden=nDone>0;
  let total=0;const cards=$('cards');cards.innerHTML='';
  GAMES.forEach(G=>{const p=G.progress();total+=p.stars;const c=document.createElement('button');c.type='button';c.className='gcard';
    c.innerHTML=`<span class="gi">${G.icon}</span><b></b><small></small><span class="prog"><span>المستوى ${p.level}</span><em>★ ${p.stars}</em></span>`;
    c.querySelector('b').textContent=G.name;c.querySelector('small').textContent=G.desc;c.onclick=()=>openGame(G);cards.appendChild(c)});
  $('totalStars').textContent=total;
  const bs=$('badges');bs.innerHTML='';let got=0;
  ACH.forEach(([id,em,label])=>{const on=!!ach.got[id];if(on)got++;const el=document.createElement('div');el.className='badge'+(on?' got':'');el.innerHTML=`<span class="em">${em}</span><small></small>`;el.querySelector('small').textContent=label;bs.appendChild(el)});
  $('achCount').textContent=got+' من '+ACH.length;$('achBar').style.width=Math.round(got/ACH.length*100)+'%';
}
let hubTab='pGames';try{const t=localStorage.getItem('arcade-tab');if(['pDaily','pGames','pBadges'].includes(t))hubTab=t}catch(e){}
function showTab(id){hubTab=id;try{localStorage.setItem('arcade-tab',id)}catch(e){}
  ['pDaily','pGames','pBadges'].forEach(p=>{$(p).hidden=p!==id});
  document.querySelectorAll('#tabbar [role=tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===id));scrollTo(0,0)}
document.querySelectorAll('#tabbar [role=tab]').forEach(b=>b.onclick=()=>{if(b.dataset.tab!==hubTab)snd('tap');showTab(b.dataset.tab)});
function openGame(G,m){
  if(active&&active.stop)active.stop();active=G;mode=m||null;stage.innerHTML='';$('ctrl').innerHTML='';
  $('gTitle').textContent=G.name;$('help').textContent=G.help;$('dailyTag').hidden=!mode;$('lvlBtn').hidden=!!mode;
  $('hub').hidden=true;$('tabbar').hidden=true;$('play').hidden=false;scrollTo(0,0);G.start();
}
function goHub(){if(active&&active.stop)active.stop();active=null;mode=null;stage.innerHTML='';$('play').hidden=true;$('hub').hidden=false;$('tabbar').hidden=false;renderHub();showTab(hubTab)}
$('back').onclick=goHub;
renderHub();showTab(hubTab);
</script>
