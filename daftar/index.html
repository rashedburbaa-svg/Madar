<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دفتر استثماراتي</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4338ca">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#4338ca; --accent-soft:#eef2ff;
  --bg:#f6f5f2; --card:#ffffff; --ink:#1f1d2b; --muted:#6b6880; --line:#e8e6ef;
  --pos:#15803d; --neg:#c62828; --fs:16px;
}
body.dark{--bg:#14131a;--card:#1f1d29;--ink:#f2f1f7;--muted:#a19eb5;--line:#2e2b3b;--accent-soft:#272447}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Tajawal",system-ui,sans-serif;font-size:var(--fs);background:var(--bg);color:var(--ink);padding-bottom:84px;min-height:100vh}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 8px;display:flex;align-items:center;gap:10px}
header h1{margin:0;font-size:1.35em;font-weight:800;flex:1;display:flex;align-items:center;gap:8px}
.status{font-size:.72em;color:var(--muted)}
.iconbtn{border:0;background:var(--card);color:var(--ink);width:40px;height:40px;border-radius:12px;font-size:1.1em;box-shadow:0 1px 2px rgba(0,0,0,.06);cursor:pointer}
main{padding:4px 12px 20px;max-width:760px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:.82em;padding:9px 0 11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button .ic{font-size:1.45em;line-height:1}
nav button.on{color:var(--accent);font-weight:700}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.kpi .l{font-size:.8em;color:var(--muted)}
.kpi .v{font-size:1.25em;font-weight:800;margin-top:4px;direction:ltr;text-align:right}
.kpi .s{font-size:.75em;color:var(--muted);margin-top:2px;direction:ltr;text-align:right}
.kpi.big{grid-column:1/-1;background:var(--accent);color:#fff}
.kpi.big .l,.kpi.big .s{color:rgba(255,255,255,.8)}
.kpi.big .v{font-size:1.7em}
.sec{background:var(--card);border-radius:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.05);overflow:hidden;border-top:4px solid var(--sc,var(--accent))}
.sec-h{display:flex;align-items:center;gap:8px;padding:12px 14px 8px}
.sec-h h2{margin:0;font-size:1.05em;font-weight:800;flex:1}
.sec-h button{border:0;background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:6px 10px;font:inherit;font-size:.85em;font-weight:700;cursor:pointer}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:100%}
th,td{padding:10px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
td:first-child{white-space:normal;min-width:120px;max-width:170px;line-height:1.35}
th{font-size:.78em;color:var(--muted);font-weight:700;background:color-mix(in srgb,var(--sc,var(--accent)) 7%,var(--card))}
td.n{direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}
tbody tr:active{background:var(--accent-soft)}
tr.b td{font-weight:800}
tfoot td{font-weight:800;border-top:2px solid var(--line);border-bottom:0}
.neg{color:var(--neg)} .pos{color:var(--pos)}
.empty{padding:14px;color:var(--muted);font-size:.9em}
.info{list-style:none;margin:0;padding:0 0 4px}
.info li{display:flex;justify-content:space-between;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.info li:last-child{border-bottom:0}
.info .k{color:var(--muted)} .info .val{font-weight:700;direction:ltr;text-align:left}
.notes{padding:4px 14px 14px;white-space:pre-wrap;line-height:1.7;cursor:pointer;min-height:40px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px 12px 14px}
.dcard{border-radius:16px;padding:12px 14px;cursor:pointer;background:color-mix(in srgb,var(--dc) 14%,var(--card));border:1px solid color-mix(in srgb,var(--dc) 25%,transparent)}
.dcard .t{font-weight:800;color:var(--dc);font-size:.95em}
.dcard .d{font-size:1.45em;font-weight:800;color:var(--dc);margin:4px 0 2px}
.dcard .s{font-size:.78em;color:var(--muted)}
.dcard.past{opacity:.6}
.info2{display:flex}
.info2>div{flex:1;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.info2>div+div{border-right:1px solid var(--line)}
.info2 .k{color:var(--muted);font-size:.82em}.info2 .val{font-weight:800;direction:ltr;text-align:right}
.photo{width:100%;border:0;border-radius:16px;padding:14px;margin-bottom:14px;font:inherit;font-weight:800;background:var(--accent);color:#fff;cursor:pointer}
.prev{width:100%;border-collapse:collapse;margin:6px 0 10px}.prev td,.prev th{padding:8px 4px;border-bottom:1px solid var(--line);font-size:.8em}
.tag{font-size:.72em;padding:2px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700}
.tag.new{background:#e3f6e8;color:#15803d}.tag.del{background:#fde4e4;color:#b71c1c}
.spin{text-align:center;padding:30px 10px;color:var(--muted)}
.addsec{width:100%;border:2px dashed var(--line);background:none;color:var(--muted);border-radius:16px;padding:14px;font:inherit;font-weight:700;cursor:pointer}
.hl-yellow td{background:#fff6d1} .hl-green td{background:#e3f6e8} .hl-red td{background:#fde4e4} .hl-blue td{background:#e2edff} .hl-purple td{background:#efe6ff}
body.dark .hl-yellow td{background:#3d3517} body.dark .hl-green td{background:#173a24} body.dark .hl-red td{background:#401d1d} body.dark .hl-blue td{background:#1b2c4a} body.dark .hl-purple td{background:#2e2148}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(10,8,20,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet h3{margin:0 0 12px;font-size:1.15em}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:.82em;color:var(--muted);margin-bottom:5px}
.fld input,.fld textarea,.fld select{width:100%;font:inherit;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--accent)}
.fld textarea{min-height:140px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 12px;font:inherit;font-size:.85em;cursor:pointer}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-left:5px;border:1px solid rgba(0,0,0,.1)}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{flex:1;border:0;border-radius:12px;padding:12px;font:inherit;font-weight:700;cursor:pointer;background:var(--accent-soft);color:var(--accent);min-width:110px}
.btn.pri{background:var(--accent);color:#fff}
.btn.del{background:#fde4e4;color:#b71c1c}
body.dark .btn.del{background:#401d1d;color:#ff8a80}
.menu{display:flex;flex-direction:column}
.menu button{border:0;background:none;color:var(--ink);font:inherit;text-align:right;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.menu button:last-child{border-bottom:0}
.menu button.d{color:var(--neg)}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.88em;opacity:0;transition:.2s;z-index:30;pointer-events:none}
.toast.on{opacity:1}
.loading{text-align:center;color:var(--muted);padding:60px 20px}
.hint{font-size:.8em;color:var(--muted);text-align:center;margin:4px 0 14px}
.colrow{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.colrow span{flex:1}
.colrow button{border:0;background:var(--bg);border-radius:8px;padding:6px 9px;font:inherit;cursor:pointer;color:var(--ink)}
</style>
</head>
<body>
<header>
  <h1 id="ttl">📓 دفتري</h1>
  <span class="status" id="st"></span>
  <button class="iconbtn" id="setBtn" aria-label="الإعدادات">⚙️</button>
</header>
<main id="view"><div class="loading">جارٍ التحميل…</div></main>
<nav id="nav"></nav>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const STANDALONE=!window.claude&&/github\.io$/.test(location.hostname);
const PAGES=["home","zad","musk","notes"];
const DEFAULT_PAGES={home:{title:"الرئيسية",icon:"🏠"},zad:{title:"منصة زاد",icon:"📈"},musk:{title:"عقد مسك",icon:"🛡️"},notes:{title:"ملاحظات",icon:"🗒️"}};
const COLORS=[["#4338ca","نيلي"],["#0f766e","أخضر مزرق"],["#b45309","برتقالي"],["#be123c","أحمر"],["#7c3aed","بنفسجي"],["#0369a1","أزرق"],["#4d7c0f","زيتي"],["#475569","رمادي"]];
const HL=[["","بدون"],["yellow","أصفر"],["green","أخضر"],["red","أحمر"],["blue","أزرق"],["purple","بنفسجي"]];
const HLC={yellow:"#f5d76e",green:"#7bc88f",red:"#ef8a8a",blue:"#86aef0",purple:"#b79af0"};
const TYPES=[["text","نص"],["num","رقم"],["kd","دينار"],["usd","دولار"],["pct","نسبة %"],["date","تاريخ"]];
let st=null, page="home", db=null, ref=null, saveT=null, saving=false, again=false, dbOk=false;

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const num=v=>(v===""||v==null||isNaN(+v))?null:+v;

/* ---------- calculated columns ---------- */
const CALC={
  price:{t:"usd",l:"سعر السهم",f:r=>num(r.qty)?num(r.value)/num(r.qty):null,tot:false},
  chg:{t:"pct",l:"التغير %",f:r=>{const v=num(r.value),p=num(r.pl);return v!=null&&p!=null&&(v-p)?p/(v-p):null},tot:true},
  tokd:{t:"kd",l:"القيمة (د.ك)",f:r=>num(r.value)!=null?num(r.value)*S().rate:null,tot:true},
  newamt:{t:"kd",l:"القسط الجديد",f:r=>num(r.nw)!=null?num(r.nw)*S().policyMonthly:null,tot:true},
  curamt:{t:"kd",l:"القسط الحالي",f:r=>num(r.cur)!=null?num(r.cur)*S().policyMonthly:null,tot:true}
};
const S=()=>st.settings;
const colType=c=>c.calc?CALC[c.calc].t:c.t;

function fmt(v,t){
  if(t==="text"||t==="date") return esc(v)||"—";
  v=num(v); if(v==null) return "—";
  const L=(x,d)=>Math.abs(x).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
  if(t==="kd") return (v<0?"-":"")+L(v,3)+" د.ك";
  if(t==="usd") return (v<0?"-":"")+"$"+L(v,2);
  if(t==="pct") return (v*100).toLocaleString("en-US",{maximumFractionDigits:1})+"%";
  return v.toLocaleString("en-US",{maximumFractionDigits:4});
}
function cellVal(r,c){return c.calc?CALC[c.calc].f(r):r[c.k]}
function sumCol(sec,k){let s=0,any=false;for(const r of sec.rows){const v=num(r[k]);if(v!=null){s+=v;any=true}}return any?s:null}
function totalsRow(sec){
  const t={};
  for(const c of sec.cols){ if(!c.calc && c.sum) t[c.k]=sumCol(sec,c.k); }
  // base sums for calc use
  for(const c of sec.cols){ if(!c.calc && t[c.k]===undefined && ["kd","usd","num","pct"].includes(c.t)) t["__"+c.k]=sumCol(sec,c.k); }
  const base={};for(const c of sec.cols){if(!c.calc)base[c.k]=t[c.k]!==undefined?t[c.k]:t["__"+c.k]}
  for(const c of sec.cols){ if(c.calc) t[c.k]=CALC[c.calc].tot?CALC[c.calc].f(base):undefined; }
  return t;
}
function roleSum(pid,role,k){let s=0,any=false;for(const sec of (st.pages[pid]?.sections||[]))if(sec.role===role){const v=sumCol(sec,k);if(v!=null){s+=v;any=true}}return any?s:null}

const DC={pink:"#be185d",gold:"#a16207",blue:"#1d4ed8",green:"#15803d",purple:"#7c3aed",red:"#b91c1c",gray:"#475569"};
const DCN=[["pink","وردي"],["gold","ذهبي"],["blue","أزرق"],["green","أخضر"],["purple","بنفسجي"],["red","أحمر"],["gray","رمادي"]];
const MON=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
function dateInfo(r){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(r.date||"");
  if(!m) return {big:"—",sub:"بدون تاريخ",sortKey:1e9,past:false};
  const y=+m[1],mo=+m[2]-1,d=+m[3];
  const now=new Date(), today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  let target=new Date(y,mo,d), years=null;
  if(r.yearly){target=new Date(today.getFullYear(),mo,d);if(target<today)target=new Date(today.getFullYear()+1,mo,d);years=target.getFullYear()-y}
  const days=Math.round((target-today)/864e5);
  const dl=n=>n===1?"يوم واحد":n===2?"يومين":n+" يوم";
  let big,sub;
  if(days===0)big="اليوم 🎉";else if(days>0)big="بعد "+dl(days);else big="مضى "+dl(-days);
  if(r.yearly){sub=d+" "+MON[mo]+(years>0?" · يكمل "+years+" سنة":"")}
  else{sub=d+" "+MON[mo]+" "+y;if(days>60){const mm=Math.floor(days/30.44);sub+=" · "+(mm>=24?Math.floor(mm/12)+" سنة و"+(mm%12)+" شهر":mm+" شهر")}}
  return {big,sub,sortKey:days<0?1e6-days:days,past:days<0};
}

function muskPaid(){return paidSince(S().policyStart,S().policyMonthly)}
function paidSince(start,monthly){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(start||"");if(!m)return{n:0,paid:0};
  const now=new Date();let n=(now.getFullYear()-+m[1])*12+(now.getMonth()-(+m[2]-1))+(now.getDate()>=+m[3]?1:0);
  n=Math.max(0,n);return{n,paid:n*(+monthly||0)};
}
function nextPay(){const d=+S().payDay||20,now=new Date(),t=new Date(now.getFullYear(),now.getMonth(),now.getDate());let n=new Date(t.getFullYear(),t.getMonth(),d);if(n<t)n=new Date(t.getFullYear(),t.getMonth()+1,d);const days=Math.round((n-t)/864e5);return{str:`${String(n.getDate()).padStart(2,"0")}/${String(n.getMonth()+1).padStart(2,"0")}/${n.getFullYear()}`,days}}
function depSec(){return (st.pages.zad.sections||[]).find(x=>x.role==="deposits")||(st.pages.zad.sections||[]).find(x=>x.id==="z2")}
function autoDeposits(){
  const sec=depSec(); if(!sec||!sec.cols) return false;
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(S().zadAutoFrom||""); if(!m) return false;
  const now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  let y=+m[1],mo=+m[2]-1; const day=+m[3]; let changed=false;
  const ak=sec.cols.find(c=>c.t==="kd"||c.t==="num"||c.t==="usd"), dk=sec.cols.find(c=>c.t==="date"||c.k==="date"), nk=sec.cols.find(c=>c.k==="note");
  for(let i=0;i<240;i++){
    const d=new Date(y,mo,day); if(d>today) break;
    const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`, id="auto-"+key;
    if(key>(S().zadAutoLast||"") && !sec.rows.some(r=>r.id===id)){
      const r={id}; if(dk)r[dk.k]=`${String(day).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`;
      if(ak)r[ak.k]=+S().zadMonthly||0; if(nk)r[nk.k]="استقطاع شهري تلقائي";
      sec.rows.push(r); S().zadAutoLast=key; changed=true;
    }
    mo++; if(mo>11){mo=0;y++}
  }
  return changed;
}
function zadTop(){
  const {n,paid:dep}=paidSince(S().zadStart,S().zadMonthly);
  const stocks=roleSum("zad","holdings","value")||0, cash=+S().zadCash||0, zUsd=stocks+cash, np=nextPay();
  const zPl=roleSum("zad","holdings","pl")||0, cost=stocks-zPl;
  return `<div class="cards">
   <div class="kpi big"><div class="l">إجمالي المحفظة (أسهم + نقد)</div><div class="v">${fmt(zUsd,"usd")}</div><div class="s">≈ ${fmt(zUsd*S().rate,"kd")} · الأسهم ${fmt(stocks,"usd")} · تكلفة الشراء ${fmt(cost,"usd")}</div></div>
   <div class="kpi"><div class="l">إجمالي الإيداعات</div><div class="v">${fmt(dep,"kd")}</div><div class="s">${n} إيداع × ${fmt(S().zadMonthly,"kd")}</div></div>
   <div class="kpi"><div class="l">الإيداع القادم</div><div class="v">${fmt(S().zadMonthly,"kd")}</div><div class="s">${np.str} · ${np.days===0?"اليوم":"بعد "+np.days+" يوم"}</div></div>
  </div>
  <section class="sec"><div class="info2"><div data-set="zadStart"><span class="k">تاريخ بداية الإيداع</span><span class="val">${esc((S().zadStart||"").split("-").reverse().join("/"))}</span></div><div data-set="zadCash"><span class="k">💵 النقد</span><span class="val">${fmt(cash,"usd")}</span></div></div></section>
  <button class="photo" id="photoBtn" ${SAMPLE_OK?"":"hidden"}>📷 تحديث الأسهم من صورة زاد</button>`;
}
function muskTop(){
  const v=roleSum("musk","funds","value")||0,{n,paid}=muskPaid(),pr=v-paid,pc=paid?pr/paid:null;
  const st0=(S().policyStart||"").split("-").reverse().join("/");
  return `<div class="cards">
   <div class="kpi big"><div class="l">الأرباح حتى الآن</div><div class="v">${fmt(pr,"kd")}</div><div class="s">${pc!=null?(pc>=0?"+":"")+fmt(pc,"pct")+" على المبلغ المدفوع":""}</div></div>
   <div class="kpi"><div class="l">المبلغ المدفوع</div><div class="v">${fmt(paid,"kd")}</div><div class="s">${n} قسط × ${fmt(S().policyMonthly,"kd")}</div></div>
   <div class="kpi"><div class="l">القيمة الحالية</div><div class="v">${fmt(v,"kd")}</div><div class="s">مجموع الصناديق</div></div>
   <div class="kpi big" style="background:var(--card);color:var(--ink)"><div class="l" style="color:var(--muted)">القسط القادم يُضاف تلقائياً</div><div class="v" style="font-size:1.25em">+${fmt(S().policyMonthly,"kd")}</div><div class="s" style="color:var(--muted)">${nextPay().str} · ${nextPay().days===0?"اليوم":"بعد "+nextPay().days+" يوم"}</div></div>
  </div>
  <section class="sec"><ul class="info"><li data-set="policyStart"><span class="k">تاريخ بداية العقد (أول قسط)</span><span class="val">${esc(st0)}</span></li></ul></section>`;
}

let SAMPLE=null, SAMPLE_OK=false;
async function initSample(){
  try{for(let k=0;k<30&&!STANDALONE&&!(window.claude&&window.claude.use);k++)await new Promise(r=>setTimeout(r,100));
    SAMPLE=window.claude&&window.claude.use?await window.claude.use("sample"):null;
    if(SAMPLE){const lim=await SAMPLE.limits().catch(()=>null);SAMPLE_OK=!!(lim&&lim.images)}
  }catch(e){SAMPLE_OK=false}
  if(st&&page==="zad")render();
}
function pickPhoto(){

async function readPhoto(files){
  openSheet(`<h3>📷 قراءة صورة المحفظة</h3><div class="spin">جارٍ قراءة الصورة… قد يستغرق دقيقة</div>`);
  const prompt=`These are screenshots from the Zad (زاد) investing app portfolio screen (Arabic). Extract every stock/ETF holding shown.
For each holding return: sym (ticker in capitals), qty (number after "كمية الاسهم"), value (the large dollar market value), pl (the profit/loss dollar amount; NEGATIVE if shown in red or with a down arrow, positive if green/up).
Also return cash = the dollar amount labelled "النقد" if visible, else null.
Reply with only JSON like {"holdings":[{"sym":"SPUS","qty":15.46,"value":855.34,"pl":-54.97}],"cash":14.17}. Numbers only, no $ or commas. Do not invent holdings that are not visible.`;
  let res;
  try{res=await SAMPLE.json(prompt,{images:files.slice(0,5),cache:false})}
  catch(e){
    const msg={not_granted:"لم يتم السماح بقراءة الصور",images_unavailable:"قراءة الصور غير متاحة هنا",image_rejected:"الصورة غير مدعومة، جرّب صورة أخرى",rate_limited:"محاولات كثيرة، جرّب بعد قليل",invalid_json:"ما قدرت أقرأ الأرقام، جرّب صورة أوضح"}[e&&e.code]||"صار خطأ، جرّب مرة ثانية";
    openSheet(`<h3>📷 قراءة صورة المحفظة</h3><p>${msg}</p><div class="acts"><button class="btn" onclick="document.getElementById('ov').classList.remove('on')">إغلاق</button></div>`);return}
  const hs=(res&&Array.isArray(res.holdings)?res.holdings:[]).map(h=>({sym:String(h.sym||"").trim().toUpperCase(),qty:num(h.qty),value:num(h.value),pl:num(h.pl)})).filter(h=>h.sym&&h.value!=null);
  const cash=res?num(res.cash):null;
  if(!hs.length&&cash==null){openSheet(`<h3>📷 قراءة صورة المحفظة</h3><p>ما لقيت أسهم في الصورة.</p>`);return}
  const sec=(st.pages.zad.sections||[]).find(x=>x.role==="holdings");
  if(!sec){toast("لا يوجد جدول أسهم");closeSheet();return}
  const have=new Map(sec.rows.map(r=>[String(r.sym||"").toUpperCase(),r]));
  const seen=new Set(hs.map(h=>h.sym));
  const gone=sec.rows.filter(r=>r.sym&&!seen.has(String(r.sym).toUpperCase()));
  let delGone=false;
  let h=`<h3>📷 هذا اللي قرأته من الصورة</h3><table class="prev"><tr><th>السهم</th><th>القيمة</th><th>الربح/الخسارة</th><th>الكمية</th><th></th></tr>`+
   hs.map(x=>`<tr><td><b>${esc(x.sym)}</b></td><td class="n">${fmt(x.value,"usd")}</td><td class="n ${x.pl<0?"neg":x.pl>0?"pos":""}">${fmt(x.pl,"usd")}</td><td class="n">${fmt(x.qty,"num")}</td><td>${have.has(x.sym)?'<span class="tag">تحديث</span>':'<span class="tag new">جديد</span>'}</td></tr>`).join("")+`</table>`;
  if(cash!=null)h+=`<p>💵 النقد: <b>${fmt(cash,"usd")}</b></p>`;
  if(gone.length)h+=`<div class="fld"><div class="chips"><button class="chip" id="dg">🗑️ حذف ${gone.map(r=>esc(r.sym)).join("، ")} (غير موجود في الصورة)</button></div></div>`;
  h+=`<div class="acts"><button class="btn pri" id="ap">تطبيق</button><button class="btn" id="cx">إلغاء</button></div>`;
  openSheet(h);
  const dg=$("#dg");if(dg)dg.onclick=()=>{delGone=!delGone;dg.classList.toggle("on",delGone)};
  $("#cx").onclick=closeSheet;
  $("#ap").onclick=()=>{
    for(const x of hs){const r=have.get(x.sym);
      if(r){r.value=x.value;if(x.pl!=null)r.pl=x.pl;if(x.qty!=null)r.qty=x.qty}
      else sec.rows.push({id:uid(),sym:x.sym,value:x.value,pl:x.pl??0,qty:x.qty??""})}
    if(delGone)sec.rows=sec.rows.filter(r=>!r.sym||seen.has(String(r.sym).toUpperCase()));
    if(cash!=null)S().zadCash=cash;
    S().zadUpdated=new Date().toISOString().slice(0,10);
    save();closeSheet();render();toast("تم تحديث الأسهم");
  };
}

function blank(){return{v:1,settings:{rate:0.307,policyMonthly:60,zadMonthly:100,policyStart:"2020-10-20",payDay:20,zadStart:"2026-07-20",zadCash:0,accent:"#4338ca",fs:16,dark:false},pages:JSON.parse(JSON.stringify(Object.fromEntries(PAGES.map(p=>[p,{...DEFAULT_PAGES[p],sections:[]}]))))}}

    openSheet(`<h3>تعديل العمود</h3><div class="fld"><label>الاسم</label><input id="cn" value="${esc(c.l)}"></div>
     ${c.calc?"":`<div class="fld"><label>النوع</label><select id="ct">${TYPES.map(([k,l])=>`<option value="${k}" ${c.t===k?"selected":""}>${l}</option>`).join("")}</select></div>`}
     ${c.calc||c.t==="text"||c.t==="date"?"":`<div class="fld"><div class="chips"><button class="chip ${c.sum?"on":""}" id="cs">Σ اجمع في الإجمالي</button></div></div>`}
     <div class="acts"><button class="btn pri" id="cok">حفظ</button></div>`);
    let sum=!!c.sum;const cs=$("#cs");if(cs)cs.onclick=()=>{sum=!sum;cs.classList.toggle("on",sum)};
    $("#cok").onclick=()=>{c.l=$("#cn").value.trim()||c.l;if(!c.calc){c.t=$("#ct").value;c.sum=sum&&!["text","date"].includes(c.t)}save();render();colsMenu(i)}});
  S2.querySelectorAll("[data-cu]").forEach(b=>b.onclick=()=>{const ci=+b.dataset.cu;if(ci>0){[sec.cols[ci-1],sec.cols[ci]]=[sec.cols[ci],sec.cols[ci-1]];save();render();colsMenu(i)}});
  S2.querySelectorAll("[data-cd]").forEach(b=>b.onclick=()=>{const ci=+b.dataset.cd;const c=sec.cols[ci];
    if(sec.cols.length<2){toast("لازم يبقى عمود واحد على الأقل");return}
    ask(`حذف عمود «${c.l}» وقيمه؟`,()=>{sec.cols.splice(ci,1);if(!c.calc)sec.rows.forEach(r=>delete r[c.k]);save();render();colsMenu(i)})});
  $("#addcol").onclick=()=>{openSheet(`<h3>عمود جديد</h3><div class="fld"><label>الاسم</label><input id="cn"></div>
     <div class="fld"><label>النوع</label><select id="ct">${TYPES.map(([k,l])=>`<option value="${k}">${l}</option>`).join("")}</select></div>
     <div class="acts"><button class="btn pri" id="cok">إضافة</button></div>`);setTimeout(()=>$("#cn").focus(),200);
    $("#cok").onclick=()=>{const l=$("#cn").value.trim();if(!l)return;const t=$("#ct").value;sec.cols.push({k:"c"+uid(),l,t,sum:["kd","usd","num"].includes(t)});save();render();colsMenu(i)}};
}
function prompt1(title,val,cb,multi){
  openSheet(`<h3>${esc(title)}</h3><div class="fld">${multi?`<textarea id="pv">${esc(val)}</textarea>`:`<input id="pv" value="${esc(val)}">`}</div><div class="acts"><button class="btn pri" id="pok">حفظ</button></div>`);
  setTimeout(()=>$("#pv").focus(),200);
  $("#pok").onclick=()=>{cb($("#pv").value.trim?$("#pv").value:$("#pv").value);closeSheet();toast("تم الحفظ")};
}
function addSection(){
  openSheet(`<h3>قسم جديد</h3><div class="fld"><label>اسم القسم</label><input id="sn" placeholder="مثال: أهدافي"></div>
   <div class="fld"><label>النوع</label><div class="chips" id="sk">
    <button class="chip on" data-k="table">📊 جدول</button><button class="chip" data-k="info">📋 قائمة بنود</button><button class="chip" data-k="notes">📝 ملاحظات</button><button class="chip" data-k="dates">📅 تواريخ</button></div></div>
   <div class="acts"><button class="btn pri" id="sok">إضافة</button></div>`);
  let kind="table";$("#sheet").querySelectorAll("#sk .chip").forEach(b=>b.onclick=()=>{kind=b.dataset.k;$("#sheet").querySelectorAll("#sk .chip").forEach(x=>x.classList.toggle("on",x===b))});
  setTimeout(()=>$("#sn").focus(),200);
  $("#sok").onclick=()=>{const title=$("#sn").value.trim()||"قسم جديد";
    const sec={id:uid(),title,kind,rows:[]};
    if(kind==="table")sec.cols=[{k:"name",l:"البند",t:"text"},{k:"amount",l:"المبلغ (د.ك)",t:"kd",sum:true},{k:"note",l:"ملاحظة",t:"text"}];
    if(kind==="notes")sec.text="";
    st.pages[page].sections.push(sec);save();closeSheet();render();toast("تمت إضافة القسم")};
}
function settings(){
  const s=S();
  openSheet(`<h3>⚙️ الإعدادات والتنسيق</h3>
   <div class="fld"><label>لون التطبيق</label><div class="chips" id="ac">${COLORS.map(([c,l])=>`<button class="chip ${s.accent===c?"on":""}" data-c="${c}"><span class="dot" style="background:${c}"></span>${l}</button>`).join("")}</div></div>
   <div class="fld"><label>حجم الخط</label><div class="chips" id="fz">${[[14,"صغير"],[16,"متوسط"],[18,"كبير"],[20,"كبير جداً"]].map(([v,l])=>`<button class="chip ${s.fs==v?"on":""}" data-v="${v}">${l}</button>`).join("")}</div></div>
   <div class="fld"><label>المظهر</label><div class="chips" id="dk"><button class="chip ${!s.dark?"on":""}" data-v="0">☀️ فاتح</button><button class="chip ${s.dark?"on":""}" data-v="1">🌙 داكن</button></div></div>
   <div class="fld"><label>أسماء الصفحات</label>${PAGES.map(p=>`<div style="display:flex;gap:8px;margin-bottom:8px"><input style="width:64px;text-align:center" data-pi="${p}" value="${esc(st.pages[p].icon)}"><input data-pt="${p}" value="${esc(st.pages[p].title)}"></div>`).join("")}</div>
   <div class="acts"><button class="btn pri" id="sok">حفظ</button></div>
   <div class="acts"><button class="btn" id="bk">📋 نسخ احتياطي</button><button class="btn" id="rs">📥 استرجاع</button></div>`);
  const sh=$("#sheet");
  sh.querySelectorAll("#ac .chip").forEach(b=>b.onclick=()=>{s.accent=b.dataset.c;applyLook();sh.querySelectorAll("#ac .chip").forEach(x=>x.classList.toggle("on",x===b));save()});
  sh.querySelectorAll("#fz .chip").forEach(b=>b.onclick=()=>{s.fs=+b.dataset.v;applyLook();sh.querySelectorAll("#fz .chip").forEach(x=>x.classList.toggle("on",x===b));save()});
  sh.querySelectorAll("#dk .chip").forEach(b=>b.onclick=()=>{s.dark=b.dataset.v==="1";applyLook();sh.querySelectorAll("#dk .chip").forEach(x=>x.classList.toggle("on",x===b));save()});
  $("#sok").onclick=()=>{PAGES.forEach(p=>{st.pages[p].icon=sh.querySelector(`[data-pi="${p}"]`).value.trim()||st.pages[p].icon;st.pages[p].title=sh.querySelector(`[data-pt="${p}"]`).value.trim()||st.pages[p].title});save();closeSheet();render();toast("تم الحفظ")};
  $("#bk").onclick=async()=>{const txt=JSON.stringify(st);try{await navigator.clipboard.writeText(txt);toast("تم نسخ البيانات — احفظها في الواتساب أو الملاحظات")}catch(e){openSheet(`<h3>انسخ هذا النص واحفظه</h3><div class="fld"><textarea readonly>${esc(txt)}</textarea></div>`)}};
  $("#rs").onclick=()=>{openSheet(`<h3>استرجاع نسخة احتياطية</h3><div class="fld"><label>الصق النص المنسوخ هنا</label><textarea id="rt"></textarea></div><div class="acts"><button class="btn del" id="rok">استرجاع (يستبدل الحالي)</button></div>`);
    $("#rok").onclick=()=>{try{const d=JSON.parse($("#rt").value);if(!d.pages)throw 0;st=normalize(d);save();closeSheet();render();toast("تم الاسترجاع")}catch(e){toast("النص غير صحيح")}}};
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-p],[data-r],[data-add],[data-sm],[data-a],[data-note],[data-set],[data-go]");
  if(!t||!st)return;
  if(t.dataset.p){page=t.dataset.p;try{location.hash=page}catch(_){};render();window.scrollTo(0,0)}
  else if(t.dataset.go){page=t.dataset.go;try{location.hash=page}catch(_){};render();window.scrollTo(0,0)}
  else if(t.dataset.r){const[i,j]=t.dataset.r.split(":").map(Number);editRow(i,j)}
  else if(t.dataset.add!==undefined){editRow(+t.dataset.add,null)}
  else if(t.dataset.sm!==undefined){secMenu(+t.dataset.sm)}
  else if(t.dataset.a==="addsec"){addSection()}
  else if(t.dataset.note!==undefined){const sec=st.pages[page].sections[+t.dataset.note];prompt1(sec.title,sec.text||"",v=>{sec.text=v;save();render()},true)}
  else if(t.dataset.set==="policyStart"||t.dataset.set==="zadStart"){const k=t.dataset.set;openSheet(`<h3>${k==="zadStart"?"تاريخ بداية الإيداع في زاد":"تاريخ بداية العقد (أول قسط)"}</h3><div class="fld"><input type="date" id="pv" value="${esc(S()[k])}"></div><div class="acts"><button class="btn pri" id="pok">حفظ</button></div>`);
    $("#pok").onclick=()=>{const v=$("#pv").value;if(v){S()[k]=v;save();render()}closeSheet()}}
  else if(t.dataset.set){const k=t.dataset.set;const lbl={zadCash:"النقد في زاد ($)",policyMonthly:"استقطاع عقد مسك الشهري (د.ك)",zadMonthly:"استقطاع زاد الشهري (د.ك)",rate:"سعر الدولار بالدينار"}[k];
    openSheet(`<h3>${lbl}</h3><div class="fld"><input id="pv" inputmode="decimal" value="${S()[k]}"></div><div class="acts"><button class="btn pri" id="pok">حفظ</button></div>`);
    setTimeout(()=>$("#pv").focus(),200);$("#pok").onclick=()=>{const v=+$("#pv").value.replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace("٫",".");if(!isNaN(v)){S()[k]=v;save();render()}closeSheet()}}
});
$("#setBtn").onclick=()=>st&&settings();
document.addEventListener("click",e=>{if(e.target.closest("#photoBtn")&&SAMPLE_OK)pickPhoto()});
initSample();
if("serviceWorker" in navigator&&location.protocol==="https:"&&STANDALONE)navigator.serviceWorker.register("sw.js").catch(()=>{});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

/* ---------- boot ---------- */
function start(data,src){
  st=normalize(data);
  const h=(location.hash||"").slice(1); if(PAGES.includes(h))page=h;
  render(); setStatus(src);
}
(async function boot(){
  let done=false;
  const timer=setTimeout(()=>{if(!done){done=true;start(localLoad(),(STANDALONE?"محفوظ على الجوال":"على الجهاز فقط"))}},10000);
  try{
    for(let k=0;k<30&&!STANDALONE&&!(window.claude&&window.claude.use);k++)await new Promise(r=>setTimeout(r,100));
    const c=window.claude; db=c&&c.use?await c.use("db"):null;
    if(db){
      ref=db.doc("app/state");
      const snap=await ref.get();
      if(done){ // late arrival: adopt server copy only if newer
        if(snap.exists){const d=snap.data();if((d.updated||0)>(st.updated||0)){st=normalize(JSON.parse(JSON.stringify(d)));render()}}
        dbOk=true;setStatus("✓ متصل");return;
      }
      done=true;clearTimeout(timer);dbOk=true;
      if(snap.exists)start(JSON.parse(JSON.stringify(snap.data())),"✓ متصل");
      else{const loc=localLoad();start(loc,"✓ متصل");if(loc)flush()}
    }else{ if(!done){done=true;clearTimeout(timer);start(localLoad(),(STANDALONE?"محفوظ على الجوال":"على الجهاز فقط"))} }
  }catch(e){ if(!done){done=true;clearTimeout(timer);start(localLoad(),(STANDALONE?"محفوظ على الجوال":"على الجهاز فقط"))} }
})();
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(st&&PAGES.includes(h)&&h!==page){page=h;render()}});
</script>
